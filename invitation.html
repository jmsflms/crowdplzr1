<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Laboratory – Cloudplzr</title>

  <!-- TailwindCSS with forms & aspect-ratio plugins -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,aspect-ratio"></script>
  <style>
    body,html{height:100%}
  </style>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>

<body class="bg-black text-white flex flex-col font-sans">
  <!-- ───── HEADER ───── -->
  <header class="fixed top-0 inset-x-0 z-50 flex items-center justify-between px-8 py-4 bg-black/80 backdrop-blur-sm">
    <h1 class="text-2xl font-extrabold tracking-tight">Cloudplzr</h1>
    <nav class="hidden md:flex space-x-6 text-sm font-medium">
      <a href="index.html" class="hover:text-red-500">Home</a>
      <a href="hardware.html" class="hover:text-red-500">Get the System</a>
      <a href="labs.html" class="hover:text-red-500">Cloudplzr Labs</a>
      <a href="experiences.html" class="hover:text-red-500">Experiences</a>
    </nav>
    <button class="px-3 py-1.5 bg-red-600 rounded text-sm font-semibold hover:bg-red-700">Sign In</button>
  </header>

  <!-- ────────── HERO ────────── -->
  <section class="relative flex-1 flex flex-col items-center justify-center text-center min-h-screen px-6 gap-6 overflow-hidden pb-24">
    <!-- Video background -->
    <video autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover z-0">
      <source src="assets/lablights.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>

    <!-- Overlay -->
    <div class="absolute inset-0 bg-black/40 z-10"></div>

    <!-- Content -->
    <div class="relative z-20 space-y-6 flex flex-col items-center justify-center w-full pt-20">
      <!-- Logo -->
      <img src="logos/cloudplzrlabs.png" alt="Cloudplzr Labs Logo" class="h-20 md:h-28 mx-auto" />

      <div class="w-full max-w-2xl mx-auto mt-12 text-center">
        <img 
          src="assets/demoday.png" 
          alt="Demo Day Invite"
          class="rounded-2xl shadow-lg w-full transition-transform duration-300 hover:scale-105"
        />
        <p class="mt-4 text-lg font-semibold text-white hover:text-red-500">
          1pm EST / 6pm GMT <br>
          SIGN UP BELOW
        </p>

        <!-- EMAIL CAPTURE FORM -->
        <div class="max-w-md mx-auto w-full mt-4">
          <form id="emailForm"
                action="https://script.google.com/macros/s/AKfycbzUfRw-L2U8wxV3fv8GDRic8JNwtxKEBsJhbrQtwNNiqe9CoJOTlq-DROinO-jVAARM3w/exec"
                method="POST"
                class="flex flex-col sm:flex-row gap-3 w-full">

            <input type="email" name="email" required
                   placeholder="Enter Email for invite"
                   class="flex-1 rounded px-4 py-3 text-black placeholder-gray-500">

            <button type="submit"
                    class="bg-red-600 hover:bg-red-700 rounded px-6 py-3 font-semibold flex items-center justify-center min-w-[9rem]">
              Get Invite ▶
            </button>
          </form>
        </div>
        <!-- /EMAIL CAPTURE FORM -->
      </div>
    </div>
  </section>

  <script>
    // Email form: validate, POST to Apps Script, then redirect
    document.getElementById('emailForm').addEventListener('submit', async e => {
      e.preventDefault();
      const form  = e.target;
      const email = form.email.value.trim();
      const button = form.querySelector('button[type="submit"]');
      const originalText = button.innerHTML;

      // simple regex validation
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
        alert('Please enter a valid email address.');
        form.email.focus();
        return;
      }

      // Show loading state
      button.disabled = true;
      button.innerHTML = `<svg class="animate-spin h-5 w-5 mr-2 inline" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path></svg>Loading...`;

      try{
        const res = await fetch(form.action, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ email })
        });
        if (res.type === 'opaque' || res.ok) {
          window.location.href = 'experiences.html';
        } else {
          throw new Error('submit failed');
        }
      } catch {
        alert('Sorry, something went wrong. Please try again.');
        button.disabled = false;
        button.innerHTML = originalText;
      }
    });
  </script>

  <!-- ────────── FOOTER ────────── -->
  <footer class="py-8 text-center text-xs text-gray-500 bg-black/90">
    © 2025 Cloudplzr Inc. All rights reserved.
  </footer>
</body>
</html>
