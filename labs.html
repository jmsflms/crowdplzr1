<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Laboratory – Cloudplzr</title>

  <!-- TailwindCSS with forms & aspect-ratio plugins -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,aspect-ratio"></script>
  <style>
    body,html{height:100%}
  </style>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>

<body class="bg-black text-white flex flex-col font-sans">
  <!-- ───── HEADER ───── -->
  <header class="fixed top-0 inset-x-0 z-50 flex items-center justify-between px-8 py-4 bg-black/80 backdrop-blur-sm">
    <h1 class="text-2xl font-extrabold tracking-tight">Cloudplzr</h1>
    <nav class="hidden md:flex space-x-6 text-sm font-medium">
      <a href="index.html" class="hover:text-red-500">Home</a>
      <a href="hardware.html" class="hover:text-red-500">Get the System</a>
      <a href="labs.html" class="hover:text-red-500">Cloudplzr Labs</a>
      <a href="experiences.html" class="hover:text-red-500">Experiences</a>
    </nav>
    <button class="px-3 py-1.5 bg-red-600 rounded text-sm font-semibold hover:bg-red-700">Sign In</button>
  </header>

  <!-- ────────── HERO ────────── -->
  <section class="relative flex-1 flex flex-col items-center justify-center text-center min-h-screen px-6 gap-6 overflow-hidden">
    <!-- Video background -->
    <video autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover z-0">
      <source src="assets/lablights.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>

    <!-- Overlay -->
    <div class="absolute inset-0 bg-black/40 z-10"></div>

    <!-- Content on top -->
    <div class="relative z-20 space-y-6 flex flex-col items-center justify-center w-full pt-20">
      <!-- Logo -->
      <img src="logos/cloudplzrlabs.png" alt="Cloudplzr Labs Logo" class="h-20 md:h-28 mx-auto" />

     <div class="w-full max-w-2xl mx-auto mt-12 text-center">
  <a 
    href="https://dice.fm/bundles/rebel-bingo-at-the-amersham-arms-orer" 
    target="_blank" 
    rel="noopener noreferrer"
    class="block"
  >
    <img 
      src="assets/rebel%20bingo%20amersham%20arms.jpg" 
      alt="Rebel Bingo at the Amersham Arms"
      class="rounded-2xl shadow-lg w-full transition-transform duration-300 hover:scale-105"
    />
    <p class="mt-4 text-lg font-semibold text-white hover:text-red-500">
      Every Friday at the Amersham Arms
    </p>
  </a>
</div>

  <!-- ────────── FOOTER ────────── -->
  <footer class="py-8 text-center text-xs text-gray-500 bg-black/90">
    © 2025 Cloudplzr Inc. All rights reserved.
  </footer>
</body>
</html>
