<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>House of Deceit Leader Board</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      margin: 0;
      padding: 20px;
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    h1, h2 {
      margin-top: 0;
    }

    .input-row,
    .leader-row {
      display: grid;
      grid-template-columns: 60px 1fr 120px;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .input-row input {
      padding: 10px;
      font-size: 16px;
      background: #111;
      color: #fff;
      border: 1px solid #333;
    }

    .leaderboard {
      margin-bottom: 30px;
    }

    .leader-row {
      background: #111;
      padding: 10px;
      border-radius: 8px;
      font-size: 18px;
    }

    /* First place */
    .leader-row.top {
      background: #c40000;
      color: #fff;
      font-weight: bold;
    }

    .rank {
      font-weight: bold;
    }

    .score {
      text-align: right;
    }

    button {
      margin-top: 15px;
      padding: 10px 16px;
      font-size: 16px;
      cursor: pointer;
      border: 1px solid #444;
      border-radius: 8px;
      background: #111;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>House of Deceit Leader Board</h1>

    <!-- LEADERBOARD -->
    <div class="leaderboard">
      <h2>Leaderboard</h2>
      <div id="leaderboard"></div>
    </div>

    <!-- PLAYER INPUTS -->
    <div id="inputs"></div>

    <button onclick="updateLeaderboard()">Update Leaderboard</button>
  </div>

  <script>
    // Change this number to however many players you want.
    const PLAYER_COUNT = 20;

    const inputsDiv = document.getElementById("inputs");
    const leaderboardDiv = document.getElementById("leaderboard");

    // Create player input rows
    for (let i = 1; i <= PLAYER_COUNT; i++) {
      const row = document.createElement("div");
      row.className = "input-row";
      row.innerHTML = `
        <div>${i}.</div>
        <input type="text" placeholder="Enter name" id="name${i}">
        <input type="number" placeholder="Score" id="score${i}" value="0">
      `;
      inputsDiv.appendChild(row);
    }

    function updateLeaderboard() {
      const players = [];

      // Read player data
      for (let i = 1; i <= PLAYER_COUNT; i++) {
        const name = document.getElementById(`name${i}`).value.trim();
        const score = parseFloat(document.getElementById(`score${i}`).value) || 0;

        if (name !== "") {
          players.push({ name, score });
        }
      }

      // Sort by score (highest first)
      players.sort((a, b) => b.score - a.score);

      leaderboardDiv.innerHTML = "";

      // Display leaderboard
      players.forEach((player, index) => {
        const row = document.createElement("div");
        row.className = "leader-row" + (index === 0 ? " top" : "");
        row.innerHTML = `
          <div class="rank">#${index + 1}</div>
          <div>${player.name}</div>
          <div class="score">${player.score}</div>
        `;
        leaderboardDiv.appendChild(row);
      });
    }

    // Update automatically
    document.addEventListener("input", updateLeaderboard);

    // Initial display
    updateLeaderboard();
  </script>
</body>
</html>
