<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Safe Dial Demo</title>
  <style>
    /* =========================
       BRAND / THEME (EDIT HERE)
       =========================
       Change these two to match your brand image exactly.
       They drive the full-screen background and accents.
    */
    :root{
      --red: #d81f2a;
      --blue:#1e4bff;

      --fg: #ffffff;
      --fgMuted: rgba(255,255,255,.78);

      --panel: rgba(255,255,255,.12);
      --panel2: rgba(255,255,255,.18);
      --stroke: rgba(255,255,255,.28);

      --shadow: rgba(0,0,0,.30);
      --shadow2: rgba(0,0,0,.45);

      --btn: rgba(255,255,255,.18);
      --btnHover: rgba(255,255,255,.24);

      --dialSize: min(82vw, 360px);
      --ringInset: 22px; /* controls how close text sits to edge */
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--fg);
      background: var(--red);
      transition: background 220ms ease;
      overflow:hidden;              /* prevent scroll while dragging */
      touch-action: none;           /* prevent browser gestures */
      -webkit-tap-highlight-color: transparent;
    }

    .app{
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      padding: 18px 16px max(18px, env(safe-area-inset-bottom));
      gap: 10px;
    }

    .top{
      width:min(560px, 94vw);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap: 8px;
      padding-top: env(safe-area-inset-top);
    }

    .timer{
      font-weight: 800;
      letter-spacing: 1px;
      font-size: 28px;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(0,0,0,.16);
      border: 1px solid rgba(255,255,255,.22);
      box-shadow: 0 10px 26px var(--shadow);
      min-width: 140px;
      text-align:center;
    }

    .instruction{
      width:100%;
      text-align:center;
      font-weight: 900;
      letter-spacing: .7px;
      font-size: clamp(16px, 4.2vw, 22px);
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.22);
      box-shadow: 0 12px 30px var(--shadow);
    }

    .metaRow{
      width:100%;
      display:flex;
      justify-content:space-between;
      gap: 10px;
      align-items:center;
      padding: 0 2px;
      color: var(--fgMuted);
      font-weight: 800;
      letter-spacing:.3px;
      font-size: 13px;
      user-select:none;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(0,0,0,.14);
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 10px 22px rgba(0,0,0,.14);
      white-space:nowrap;
    }
    .dot{
      width:10px;height:10px;border-radius:50%;
      background: rgba(255,255,255,.92);
      box-shadow: 0 0 0 3px rgba(255,255,255,.12);
    }

    .stage{
      width:min(560px, 94vw);
      flex: 1;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap: 14px;
      position:relative;
    }

    .dialWrap{
      width: var(--dialSize);
      aspect-ratio: 1/1;
      position:relative;
      display:grid;
      place-items:center;
      user-select:none;
      touch-action:none;
    }

    /* Fixed pointer at 12 o'clock */
    .pointer{
      position:absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width:0;height:0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-bottom: 28px solid rgba(255,255,255,.95);
      filter: drop-shadow(0 10px 16px rgba(0,0,0,.35));
      z-index: 5;
      pointer-events:none;
    }

    /* Curved direction arrow (SVG) */
    .dirArrow{
      position:absolute;
      right: -12px;
      top: 14px;
      width: 86px;
      height: 86px;
      z-index: 6;
      pointer-events:none;
      filter: drop-shadow(0 12px 20px rgba(0,0,0,.35));
      opacity: .95;
      transform-origin: 50% 50%;
      transition: transform 200ms ease;
    }
    /* When BLUE (anti-clockwise), flip arrow horizontally */
    body.isBlue .dirArrow{
      transform: scaleX(-1);
    }

    /* The rotating dial */
    .dial{
      width:100%;
      height:100%;
      border-radius: 50%;
      position:relative;
      background:
        radial-gradient(circle at 28% 22%, rgba(255,255,255,.30), rgba(255,255,255,.10) 40%, rgba(0,0,0,.20) 100%);
      border: 2px solid rgba(255,255,255,.28);
      box-shadow: 0 18px 46px var(--shadow2);
      transform: rotate(var(--angle, 0deg));
      transition: transform 70ms linear;
      touch-action:none;
      will-change: transform;
    }

    /* Inner gloss ring */
    .dial::before{
      content:"";
      position:absolute;
      inset: 10px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.12);
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.14), rgba(0,0,0,.0) 60%);
      pointer-events:none;
    }

    /* Answer ring items sit on the dial and rotate with it */
    .ring{
      position:absolute;
      inset: var(--ringInset);
      border-radius:50%;
      pointer-events:none; /* the dial handles drag */
    }

    .seg{
      position:absolute;
      left:50%;
      top:50%;
      transform-origin: 0 0;
      width: 44%;
      height: 0;
      pointer-events:none;
    }

    .seg span{
      display:block;
      transform: translate(0, -14px);
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(0,0,0,.16);
      border: 1px solid rgba(255,255,255,.16);
      color: rgba(255,255,255,.92);
      font-weight: 900;
      letter-spacing:.2px;
      font-size: 12px;
      max-width: 150px;
      overflow:hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      box-shadow: 0 10px 18px rgba(0,0,0,.18);
    }

    /* Center subject */
    .center{
      position:absolute;
      inset: 28%;
      border-radius: 50%;
      background: rgba(0,0,0,.18);
      border: 1px solid rgba(255,255,255,.22);
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding: 12px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
    }
    .question{
      font-weight: 950;
      letter-spacing:.2px;
      font-size: clamp(12px, 3.5vw, 14px);
      line-height: 1.25;
      color: rgba(255,255,255,.95);
      text-shadow: 0 8px 18px rgba(0,0,0,.25);
    }

    /* Selected pulse feedback */
    .pulse{
      animation: pulse 180ms ease-out;
    }
    @keyframes pulse{
      0%{ transform: scale(1); }
      50%{ transform: scale(1.02); }
      100%{ transform: scale(1); }
    }

    .buttons{
      width:min(560px, 94vw);
      display:flex;
      gap: 12px;
      justify-content:center;
      padding-bottom: 6px;
    }

    button{
      border: 1px solid rgba(255,255,255,.26);
      background: var(--btn);
      color: var(--fg);
      padding: 14px 16px;
      border-radius: 16px;
      font-weight: 950;
      letter-spacing:.6px;
      cursor:pointer;
      box-shadow: 0 14px 30px rgba(0,0,0,.22);
      min-width: 140px;
      transition: transform 80ms ease, background 120ms ease;
      user-select:none;
      touch-action: manipulation;
    }
    button:active{ transform: translateY(1px) scale(.99); }
    button:hover{ background: var(--btnHover); }
    button:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    /* Modal */
    .modal{
      position:fixed;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      padding: 18px;
      background: rgba(0,0,0,.52);
      backdrop-filter: blur(8px);
      z-index: 50;
    }
    .modal.show{ display:flex; }
    .card{
      width:min(520px, 94vw);
      border-radius: 24px;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.22);
      box-shadow: 0 26px 70px rgba(0,0,0,.45);
      padding: 22px 18px 16px;
      text-align:center;
    }
    .unlocked{
      font-size: clamp(30px, 9vw, 44px);
      font-weight: 1000;
      letter-spacing: 1px;
      margin: 6px 0 10px;
      text-shadow: 0 14px 40px rgba(0,0,0,.35);
    }
    .hint{
      color: var(--fgMuted);
      font-weight: 850;
      letter-spacing:.4px;
      margin-bottom: 14px;
    }
    .card button{
      min-width: 220px;
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="top">
      <div class="timer" id="timer">00:00</div>

      <div class="instruction" id="instruction">PASS TO CLOCKWISE PLAYER</div>

      <div class="metaRow">
        <div class="pill"><span class="dot"></span><span id="stateLabel">RED</span></div>
        <div class="pill" id="codePill">CODE: <span id="codeLabel">0</span> / 5</div>
      </div>
    </div>

    <div class="stage">
      <div class="dialWrap" id="dialWrap" aria-label="Safe dial">
        <div class="pointer" aria-hidden="true"></div>

        <!-- Direction arrow -->
        <svg class="dirArrow" viewBox="0 0 100 100" aria-hidden="true">
          <path d="M20,60 C20,30 45,15 65,20" fill="none" stroke="rgba(255,255,255,.95)" stroke-width="8" stroke-linecap="round"/>
          <path d="M62,10 L82,22 L58,30 Z" fill="rgba(255,255,255,.95)"/>
        </svg>

        <!-- Rotating dial -->
        <div class="dial" id="dial" style="--angle:0deg">
          <div class="ring" id="ring"></div>
          <div class="center">
            <div class="question" id="question">Loading…</div>
          </div>
        </div>
      </div>

      <div class="buttons">
        <button id="lockBtn">LOCK</button>
        <button id="resetBtn">RESET</button>
      </div>
    </div>
  </div>

  <!-- UNLOCKED MODAL -->
  <div class="modal" id="modal">
    <div class="card">
      <div class="unlocked">SAFE UNLOCKED</div>
      <div class="hint">Press RESET to play again</div>
      <button id="modalReset">RESET</button>
    </div>
  </div>

<script>
/* ===========================================================
   QUESTIONS DATA (EDIT THIS LATER TO CHANGE QUESTIONS)
   ===========================================================
   Each item has:
   - prompt: what appears in the center
   - answers: 10 answer strings (must include the correct once)
   - correct: the correct answer string (must match exactly one of answers)

   To add/replace questions later:
   - keep exactly 5 for v0
   - keep exactly 10 answers each
*/
const QUESTIONS_SOURCE = [
  {
    prompt: "What is Chappell Roan’s middle name?",
    answers: ["Rose","Lily","Daisy","Violet","Ivy","Hazel","June","Pearl","Grace","Mae"],
    correct: "Rose"
  },
  {
    prompt: "Which country’s capital city is Tokyo?",
    answers: ["Japan","China","South Korea","Thailand","Vietnam","Singapore","Malaysia","Indonesia","Philippines","Taiwan"],
    correct: "Japan"
  },
  {
    prompt: "In tennis, what is the score called at 40–40?",
    answers: ["Deuce","Love","Advantage","Break","Ace","Tie","Set","Match","Rally","Fault"],
    correct: "Deuce"
  },
  {
    prompt: "Which planet is known as the Red Planet?",
    answers: ["Mars","Venus","Jupiter","Saturn","Mercury","Neptune","Uranus","Earth","Pluto","Moon"],
    correct: "Mars"
  },
  {
    prompt: "Which month has 28 days in a common (non-leap) year?",
    answers: ["February","January","March","April","May","June","July","August","September","October"],
    correct: "February"
  }
];

(() => {
  // ======================
  // Constants / Geometry
  // ======================
  const STEPS = 10;
  const STEP_DEG = 360 / STEPS;

  // ======================
  // Elements
  // ======================
  const body = document.body;
  const dialWrap = document.getElementById("dialWrap");
  const dial = document.getElementById("dial");
  const ring = document.getElementById("ring");
  const questionEl = document.getElementById("question");

  const timerEl = document.getElementById("timer");
  const instructionEl = document.getElementById("instruction");
  const stateLabel = document.getElementById("stateLabel");
  const codeLabel = document.getElementById("codeLabel");

  const lockBtn = document.getElementById("lockBtn");
  const resetBtn = document.getElementById("resetBtn");

  const modal = document.getElementById("modal");
  const modalReset = document.getElementById("modalReset");

  // ======================
  // Game State
  // ======================
  let state = "RED";           // RED => clockwise, BLUE => anti-clockwise
  let angle = 0;               // dial rotation angle in degrees
  let code = 0;                // 0..5
  let qIndex = 0;              // current question index 0..4
  let lockedOut = false;       // true when SAFE UNLOCKED modal shown

  // Timer
  let startTime = 0;
  let timerRAF = 0;

  // Shuffled question set used for current run
  let questions = [];

  // Drag
  let isDragging = false;
  let startPointerAngle = 0;
  let startDialAngle = 0;
  let lastDetentIndex = 0;
  let rafMovePending = false;
  let pendingEvent = null;

  // ======================
  // Utilities
  // ======================

  // (1) Shuffling logic
  function shuffle(arr){
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Build questions for a new run: shuffle answers so correct position changes each reset
  function buildQuestions(){
    questions = QUESTIONS_SOURCE.map(q => {
      const shuffled = shuffle(q.answers);
      const correctIndex = shuffled.indexOf(q.correct);
      return {
        prompt: q.prompt,
        answers: shuffled,
        correctIndex
      };
    });
  }

  function setState(next){
    state = next;
    const isBlue = (state === "BLUE");
    body.classList.toggle("isBlue", isBlue);
    body.style.background = isBlue ? getCssVar("--blue") : getCssVar("--red");

    stateLabel.textContent = isBlue ? "BLUE" : "RED";
    instructionEl.textContent = isBlue ? "PASS TO ANTI-CLOCKWISE PLAYER" : "PASS TO CLOCKWISE PLAYER";
  }

  function getCssVar(name){
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function setAngle(a){
    angle = a;
    dial.style.setProperty("--angle", `${angle}deg`);
  }

  // (2) Angle-to-index mapping
  // Pointer is fixed at 12 o'clock; dial rotates. We want which segment is under pointer.
  function angleToIndex(a){
    // At 0deg, index 0 is at pointer.
    // As dial rotates clockwise (positive angle), the pointer effectively moves "back" over indices.
    const normalized = ((-a % 360) + 360) % 360; // 0..359
    const idx = Math.round(normalized / STEP_DEG) % STEPS;
    return idx;
  }

  function snapAngle(a){
    return Math.round(a / STEP_DEG) * STEP_DEG;
  }

  // Haptics (best-effort)
  function vibrate(ms){
    try{
      if (navigator.vibrate) navigator.vibrate(ms);
    }catch(_){}
  }

  // Visual pulse feedback (covers devices without haptics)
  function pulseDial(){
    dial.classList.remove("pulse");
    // Force reflow to restart animation
    void dial.offsetWidth;
    dial.classList.add("pulse");
  }

  // Optional tiny "click" sound using WebAudio (no external assets).
  // Safe on most browsers; if blocked, it simply does nothing.
  let audioCtx = null;
  function clickSound(){
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = "square";
      o.frequency.value = 620;
      g.gain.value = 0.0001;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      const now = audioCtx.currentTime;
      g.gain.exponentialRampToValueAtTime(0.15, now + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.04);
      o.stop(now + 0.05);
    }catch(_){}
  }

  function formatMMSS(ms){
    const total = Math.floor(ms / 1000);
    const m = Math.floor(total / 60);
    const s = total % 60;
    return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  }

  // ======================
  // Render ring segments
  // ======================
  function renderRing(){
    ring.innerHTML = "";
    const q = questions[qIndex];
    for (let i=0;i<STEPS;i++){
      const seg = document.createElement("div");
      seg.className = "seg";
      const angleDeg = (i * STEP_DEG) - 90; // start at top
      // Place each segment around a circle
      seg.style.transform = `rotate(${angleDeg}deg) translate(${(dialWrap.clientWidth/2) - 48}px) rotate(${-(angleDeg)}deg)`;
      const span = document.createElement("span");
      span.textContent = q.answers[i];
      seg.appendChild(span);
      ring.appendChild(seg);
    }
  }

  function renderQuestion(){
    questionEl.textContent = questions[qIndex].prompt;
    renderRing();
    codeLabel.textContent = String(code);
  }

  // ======================
  // Timer
  // ======================
  function startTimer(){
    cancelAnimationFrame(timerRAF);
    startTime = performance.now();
    const tick = () => {
      const elapsed = performance.now() - startTime;
      timerEl.textContent = formatMMSS(elapsed);
      timerRAF = requestAnimationFrame(tick);
    };
    timerRAF = requestAnimationFrame(tick);
  }

  // ======================
  // Reset / Unlock
  // ======================
  // (4) Reset logic
  function hardReset(){
    lockedOut = false;
    modal.classList.remove("show");

    buildQuestions();
    qIndex = 0;
    code = 0;

    setState("RED");
    setAngle(0);
    lastDetentIndex = angleToIndex(angle);

    renderQuestion();
    startTimer();

    lockBtn.disabled = false;
  }

  function showUnlocked(){
    lockedOut = true;
    modal.classList.add("show");
    lockBtn.disabled = true;
    vibrate(50);
    pulseDial();
    clickSound();
  }

  // ======================
  // Drag handling
  // ======================
  function pointerAngleFromEvent(e){
    const rect = dialWrap.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    const x = (e.clientX ?? (e.touches && e.touches[0].clientX)) - cx;
    const y = (e.clientY ?? (e.touches && e.touches[0].clientY)) - cy;
    const rad = Math.atan2(y, x);
    let deg = rad * (180/Math.PI);
    deg += 90; // make 0 at top
    return deg;
  }

  function deltaAngle(a, b){
    // smallest signed difference (b - a) in degrees, range [-180, 180]
    let d = b - a;
    while (d > 180) d -= 360;
    while (d < -180) d += 360;
    return d;
  }

  // (3) Direction enforcement
  function canMove(delta){
    // We define:
    // - RED: allow clockwise only => dial angle can only increase
    // - BLUE: allow anti-clockwise only => dial angle can only decrease
    if (state === "RED") return delta >= 0;
    return delta <= 0;
  }

  function onDown(e){
    if (lockedOut) return;
    e.preventDefault();
    isDragging = true;
    startPointerAngle = pointerAngleFromEvent(e);
    startDialAngle = angle;
    lastDetentIndex = angleToIndex(angle);
    pendingEvent = e;
  }

  function onMove(e){
    if (!isDragging || lockedOut) return;
    e.preventDefault();
    pendingEvent = e;
    if (!rafMovePending){
      rafMovePending = true;
      requestAnimationFrame(applyMove);
    }
  }

  function applyMove(){
    rafMovePending = false;
    if (!isDragging || !pendingEvent) return;

    const p = pointerAngleFromEvent(pendingEvent);
    const d = deltaAngle(startPointerAngle, p);
    const proposed = startDialAngle + d;
    const deltaFromCurrent = proposed - angle;

    if (!canMove(deltaFromCurrent)) return;

    setAngle(proposed);

    // Detent haptic when crossing into a new segment
    const idx = angleToIndex(angle);
    if (idx !== lastDetentIndex){
      lastDetentIndex = idx;
      vibrate(8);
      pulseDial();
      clickSound();
    }
  }

  function onUp(e){
    if (!isDragging) return;
    e.preventDefault();
    isDragging = false;

    // Snap to nearest detent
    const snapped = snapAngle(angle);
    const moved = snapped - angle;

    // If snapping would violate direction (rare), clamp by staying put
    if (moved !== 0 && !canMove(moved)){
      setAngle(angle); // keep
    }else{
      setAngle(snapped);
    }

    // Stronger tactile confirmation of snap
    vibrate(12);
    clickSound();
  }

  // ======================
  // Lock handling
  // ======================
  // (5) Lock handling
  function onLock(){
    if (lockedOut) return;

    // Always flip state first (movie cliché)
    setState(state === "RED" ? "BLUE" : "RED");

    // Strong lock feedback
    vibrate(30);
    pulseDial();
    clickSound();

    const currentQ = questions[qIndex];
    const selectedIndex = angleToIndex(angle);
    const isCorrect = (selectedIndex === currentQ.correctIndex);

    if (isCorrect){
      code += 1;
      codeLabel.textContent = String(code);

      if (code >= 5){
        showUnlocked();
        return;
      }

      // Advance to next question (Q1..Q5). After Q5, loop back to Q1 for demo simplicity.
      qIndex = (qIndex + 1) % questions.length;
      renderQuestion();
    } else {
      // OPTION A reset:
      // - progress resets
      // - question resets to Q1 immediately
      code = 0;
      qIndex = 0;
      codeLabel.textContent = "0";
      renderQuestion();
    }
  }

  // ======================
  // Wire up events
  // ======================
  // Pointer events (best for modern mobile + desktop)
  dialWrap.addEventListener("pointerdown", onDown, {passive:false});
  dialWrap.addEventListener("pointermove", onMove, {passive:false});
  dialWrap.addEventListener("pointerup", onUp, {passive:false});
  dialWrap.addEventListener("pointercancel", onUp, {passive:false});

  // Fallback touch events (some Safari edge cases)
  dialWrap.addEventListener("touchstart", onDown, {passive:false});
  dialWrap.addEventListener("touchmove", onMove, {passive:false});
  dialWrap.addEventListener("touchend", onUp, {passive:false});

  lockBtn.addEventListener("click", onLock);
  resetBtn.addEventListener("click", hardReset);
  modalReset.addEventListener("click", hardReset);

  // Re-render ring on resize to keep placement tidy
  window.addEventListener("resize", () => {
    if (!questions.length) return;
    renderRing();
  });

  // Init
  hardReset();
})();
</script>
</body>
</html>
