<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Safe Dial Demo</title>
  <style>
    :root{
      --red:#e0162b;
      --blue:#1246ff;

      --text:#ffffff;
      --muted:rgba(255,255,255,.72);

      --shadow: 0 14px 40px rgba(0,0,0,.30);
      --shadow2: 0 10px 22px rgba(0,0,0,.24);

      --ringStroke: rgba(255,255,255,.18);
      --ringStrokeStrong: rgba(255,255,255,.30);
      --wedgeA: rgba(255,255,255,.08);
      --wedgeB: rgba(255,255,255,.14);
      --wedgeActive: rgba(255,255,255,.26);

      --btnBg: rgba(255,255,255,.12);
      --btnBgHover: rgba(255,255,255,.18);
      --btnBorder: rgba(255,255,255,.18);
      --btnBorderStrong: rgba(255,255,255,.30);

      --focus: rgba(255,255,255,.32);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html,body { height:100%; margin:0; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji"; color:var(--text); }
    body{
      background: var(--red);
      display:flex;
      align-items: stretch;
      justify-content:center;
      transition: background-color 220ms ease;
      overflow:hidden;
      touch-action: manipulation;
    }
    body.state-blue{ background: var(--blue); }

    .app{
      width: min(780px, 100%);
      height: 100%;
      padding: clamp(12px, 2.2vh, 22px);
      padding-top: max(clamp(12px, 2.2vh, 22px), env(safe-area-inset-top));
      padding-bottom: max(clamp(12px, 2.2vh, 22px), env(safe-area-inset-bottom));
      display:flex;
      flex-direction: column;
      gap: clamp(10px, 1.6vh, 16px);
    }

    .topbar{
      display:flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      text-align:center;
    }

    .timerRow{
      width:100%;
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap:10px;
    }

    .timer{
      flex:1;
      background: rgba(0,0,0,.20);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 18px;
      padding: 10px 14px;
      box-shadow: var(--shadow2);
      display:flex;
      align-items:center;
      justify-content: space-between;
      min-height: 48px;
    }
    .timer .label{
      font-size: 12px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 750;
    }
    .timer .value{
      font-variant-numeric: tabular-nums;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: .04em;
    }

    .code{
      background: rgba(0,0,0,.20);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 18px;
      padding: 10px 14px;
      box-shadow: var(--shadow2);
      min-height: 48px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      white-space: nowrap;
    }
    .code .k{ font-size: 12px; letter-spacing:.18em; text-transform: uppercase; color: var(--muted); font-weight: 750; }
    .code .v{ font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 900; }

    .instruction{
      width:100%;
      background: rgba(0,0,0,.22);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 22px;
      padding: 14px 16px;
      box-shadow: var(--shadow);
      font-weight: 950;
      letter-spacing: .06em;
      text-transform: uppercase;
      font-size: clamp(14px, 2.0vh, 18px);
    }

    /* Curved direction arrow near the dial; flips with state */
    .arrowRow{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      margin-top: -2px;
      margin-bottom: -2px;
    }
    .arrow{
      width: min(520px, 92%);
      height: 34px;
      display:flex;
      align-items:center;
      justify-content:center;
      color: rgba(255,255,255,.88);
      user-select:none;
      pointer-events:none;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,.22));
    }
    .arrow svg{ width:100%; height:100%; display:block; }
    .arrow .line{
      stroke: rgba(255,255,255,.78);
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .middle{
      flex: 1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 4px 0;
    }

    .dialWrap{
      width: min(560px, 92vw);
      aspect-ratio: 1/1;
      position: relative;
      border-radius: 999px;
      background:
        radial-gradient(circle at 50% 40%, rgba(255,255,255,.14), rgba(255,255,255,0) 56%),
        radial-gradient(circle at 50% 90%, rgba(0,0,0,.18), rgba(0,0,0,0) 55%),
        rgba(0,0,0,.14);
      border: 1px solid rgba(255,255,255,.20);
      box-shadow: var(--shadow);
      overflow:hidden;
      touch-action: none; /* prevent page scroll while dragging */
    }

    #ringSvg{
      position:absolute;
      inset: 0;
      width:100%;
      height:100%;
      display:block;
    }

    .centerPanel{
      position:absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%,-50%);
      width: 54%;
      height: 54%;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(0,0,0,.40), rgba(0,0,0,.22));
      border: 1px solid rgba(255,255,255,.20);
      box-shadow: 0 18px 45px rgba(0,0,0,.28);
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 16px;
      text-align:center;
      z-index: 5;
      pointer-events:none;
    }
    .centerPanel .qWrap{
      display:flex;
      flex-direction: column;
      gap: 10px;
      align-items:center;
      justify-content:center;
    }
    .centerPanel .qNum{
      font-size: 12px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: rgba(255,255,255,.78);
      font-weight: 850;
    }
    .centerPanel .qText{
      font-size: clamp(14px, 2.0vh, 18px);
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: .01em;
      padding: 0 4px;
    }

    .handLayer{
      position:absolute;
      inset: 0;
      z-index: 8;
      pointer-events:none;
    }
    .hand{
      position:absolute;
      left:50%;
      top:50%;
      width: 6px;
      height: 46%;
      transform-origin: 50% 92%;
      transform: translate(-50%,-92%) rotate(0deg);
      border-radius: 999px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 16px 30px rgba(0,0,0,.30);
    }
    .hand::after{
      content:"";
      position:absolute;
      left:50%;
      top: 8px;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 13px solid transparent;
      border-right: 13px solid transparent;
      border-bottom: 24px solid rgba(255,255,255,.96);
      filter: drop-shadow(0 10px 14px rgba(0,0,0,.24));
    }
    .hubGlow{
      position:absolute;
      left:50%;
      top:50%;
      transform: translate(-50%,-50%);
      width: 40%;
      height: 40%;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(255,255,255,.15), rgba(255,255,255,0) 62%);
      opacity: .75;
      pointer-events:none;
    }
    .hub{
      position:absolute;
      left:50%;
      top:50%;
      transform: translate(-50%,-50%);
      width: 16%;
      height: 16%;
      border-radius: 999px;
      background:
        radial-gradient(circle at 35% 30%, rgba(255,255,255,.24), rgba(255,255,255,0) 55%),
        linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.03)),
        rgba(0,0,0,.25);
      border: 1px solid rgba(255,255,255,.20);
      box-shadow: 0 18px 40px rgba(0,0,0,.28);
    }

    .bottom{
      display:flex;
      gap: 12px;
      align-items:center;
      justify-content:center;
      padding-top: 2px;
    }
    .btn{
      flex:1;
      max-width: 360px;
      border-radius: 18px;
      padding: 16px 16px;
      border: 1px solid var(--btnBorder);
      background: var(--btnBg);
      color: var(--text);
      font-weight: 950;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-size: 16px;
      box-shadow: var(--shadow2);
      cursor: pointer;
      user-select:none;
      touch-action: manipulation;
      transition: transform 120ms ease, background-color 120ms ease, border-color 120ms ease;
    }
    .btn:active{ transform: translateY(1px) scale(0.99); }
    .btn:hover{ background: var(--btnBgHover); border-color: var(--btnBorderStrong); }
    .btn:focus-visible{
      outline: none;
      box-shadow: var(--shadow2), 0 0 0 4px var(--focus);
    }
    .btn.lock{
      background: rgba(255,255,255,.18);
      border-color: rgba(255,255,255,.28);
    }

    /* Segment labels */
    .segText{
      font-size: 14px;
      font-weight: 900;
      fill: rgba(255,255,255,.94);
      text-anchor: middle;
      dominant-baseline: middle;
      paint-order: stroke;
      stroke: rgba(0,0,0,.38);
      stroke-width: 3.2px;
      letter-spacing: .01em;
    }
    .segText.small{ font-size: 12px; }

    /* Wedges */
    .wedge{
      stroke: var(--ringStroke);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }
    .wedge.altA{ fill: var(--wedgeA); }
    .wedge.altB{ fill: var(--wedgeB); }
    .wedge.active{ fill: var(--wedgeActive); stroke: var(--ringStrokeStrong); stroke-width: 2.5; }

    .dialWrap.snapFlash{
      animation: snapFlash 120ms ease;
    }
    @keyframes snapFlash{
      0% { filter: brightness(1); }
      40% { filter: brightness(1.12); }
      100% { filter: brightness(1); }
    }

    .modal{
      position: fixed;
      inset: 0;
      display:none;
      align-items:center;
      justify-content:center;
      padding: 22px;
      z-index: 999;
      background: rgba(0,0,0,.62);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .modal.show{ display:flex; }
    .modalCard{
      width: min(520px, 92vw);
      border-radius: 26px;
      background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.08));
      border: 1px solid rgba(255,255,255,.22);
      box-shadow: 0 30px 80px rgba(0,0,0,.40);
      padding: 22px 18px;
      text-align:center;
    }
    .modalCard h1{
      margin: 6px 0 10px;
      font-size: clamp(26px, 3.8vh, 38px);
      letter-spacing: .06em;
      text-transform: uppercase;
      font-weight: 1000;
    }
    .modalCard p{
      margin: 0 0 14px;
      color: rgba(255,255,255,.84);
      font-weight: 650;
      line-height: 1.25;
    }
    .modalCard .hint{
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(255,255,255,.74);
    }

    @media (max-width: 420px){
      .segText{ font-size: 12px; }
      .segText.small{ font-size: 11px; }
      .btn{ font-size: 15px; padding: 15px 14px; }
      .timer .value{ font-size: 22px; }
    }
  </style>
</head>
<body class="state-red">
  <div class="app">
    <div class="topbar">
      <div class="timerRow">
        <div class="timer" aria-label="Timer">
          <div class="label">TIMER</div>
          <div class="value" id="timer">00:00</div>
        </div>
        <div class="code" aria-label="Progress">
          <div class="k">CODE</div>
          <div class="v" id="code">0 / 5</div>
        </div>
      </div>

      <div class="instruction" id="instruction">PASS TO CLOCKWISE PLAYER</div>

      <div class="arrowRow">
        <div class="arrow" aria-hidden="true">
          <svg viewBox="0 0 520 40" role="img" aria-label="Direction arrow">
            <path class="line" id="arrowPath" d="M 40 30 Q 260 2 480 30" />
            <path class="line" id="arrowHead" d="M 470 20 L 482 30 L 468 34" />
          </svg>
        </div>
      </div>
    </div>

    <div class="middle">
      <div class="dialWrap" id="dial" aria-label="Safe dial">
        <svg id="ringSvg" viewBox="0 0 1000 1000" aria-hidden="true"></svg>

        <div class="handLayer">
          <div class="hubGlow"></div>
          <div class="hand" id="hand"></div>
          <div class="hub"></div>
        </div>

        <div class="centerPanel">
          <div class="qWrap">
            <div class="qNum" id="qNum">Q1</div>
            <div class="qText" id="qText">…</div>
          </div>
        </div>
      </div>
    </div>

    <div class="bottom">
      <button class="btn lock" id="lockBtn">LOCK</button>
      <button class="btn" id="resetBtn">RESET</button>
    </div>
  </div>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Safe Unlocked">
    <div class="modalCard">
      <h1>SAFE UNLOCKED</h1>
      <p>You cracked the 5-step code.</p>
      <div class="hint">Press RESET to play again.</div>
    </div>
  </div>

<script>
/*
  DATA (edit this to change questions/answers/correctIndex)
  - No shuffling.
  - Exactly 5 questions.
  - Each question has 10 fixed answer strings.
  - correctIndex is the fixed segment index (0..9) that is correct for that question.
*/
const QUESTIONS = [
  {
    prompt: "What is Chappell Roan’s middle name?",
    answers: ["Rose","Lily","Daisy","Violet","Ivy","Hazel","June","Pearl","Grace","Mae"],
    correctIndex: 0
  },
  {
    prompt: "Which country’s capital city is Tokyo?",
    answers: ["Japan","China","South Korea","Thailand","Vietnam","Singapore","Malaysia","Indonesia","Philippines","Taiwan"],
    correctIndex: 0
  },
  {
    prompt: "In tennis, what is the score called at 40–40?",
    answers: ["Deuce","Love","Advantage","Break","Ace","Tie","Set","Match","Rally","Fault"],
    correctIndex: 0
  },
  {
    prompt: "Which planet is known as the Red Planet?",
    answers: ["Mars","Venus","Jupiter","Saturn","Mercury","Neptune","Uranus","Earth","Pluto","Moon"],
    correctIndex: 0
  },
  {
    prompt: "Which month has 28 days in a common (non-leap) year?",
    answers: ["February","January","March","April","May","June","July","August","September","October"],
    correctIndex: 0
  }
];

(() => {
  const SEGMENTS = 10;
  const STEP_DEG = 360 / SEGMENTS;

  const body = document.body;
  const dial = document.getElementById("dial");
  const ringSvg = document.getElementById("ringSvg");
  const handEl = document.getElementById("hand");
  const qNumEl = document.getElementById("qNum");
  const qTextEl = document.getElementById("qText");
  const instructionEl = document.getElementById("instruction");
  const timerEl = document.getElementById("timer");
  const codeEl = document.getElementById("code");
  const lockBtn = document.getElementById("lockBtn");
  const resetBtn = document.getElementById("resetBtn");
  const modal = document.getElementById("modal");

  const arrowPath = document.getElementById("arrowPath");
  const arrowHead = document.getElementById("arrowHead");

  // Game state
  let state = "RED"; // RED: clockwise only. BLUE: anti-clockwise only.
  let questionIndex = 0;
  let progress = 0; // correct-in-a-row count
  let unlocked = false;

  // Pointer state: current selected segment index (0..9)
  let pointerIndex = 0;

  // Drag tracking
  let dragging = false;
  let lastAngleDeg = null;
  let pendingDelta = 0;
  let rafActive = false;

  // Timer
  let elapsedSec = 0;
  let timerInterval = null;

  // Wedge refs for fast highlighting
  const wedgeEls = [];

  /* =========================================================
     (1) Segment geometry / mapping pointer angle to segment index
     - 0 degrees is at 12 o'clock (straight up).
     - Angle increases CLOCKWISE.
     - Segment i corresponds to the detent angle i * STEP_DEG.
     - We store pointerIndex directly; hand rotation = pointerIndex * STEP_DEG.
  ========================================================== */

  function normalizeDeg(d){
    d = d % 360;
    if (d < 0) d += 360;
    return d;
  }

  function angleFromPoint(clientX, clientY){
    const rect = dial.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    const dx = clientX - cx;
    const dy = clientY - cy;

    // atan2 gives 0 at +x (3 o'clock). Convert to 0 at 12 o'clock by adding 90deg.
    const rad = Math.atan2(dy, dx);
    const deg = normalizeDeg(rad * 180 / Math.PI + 90);
    return deg;
  }

  function signedAngleDelta(prevDeg, currDeg){
    // shortest signed delta in [-180, 180)
    return (currDeg - prevDeg + 540) % 360 - 180;
  }

  /* =========================================================
     (2) Direction enforcement
     - RED: allow only clockwise movement (positive delta).
     - BLUE: allow only anti-clockwise movement (negative delta).
     - Wrong-direction movement is ignored (strict).
  ========================================================== */
  function filterDeltaByDirection(delta){
    if (state === "RED") return delta > 0 ? delta : 0;
    return delta < 0 ? delta : 0;
  }

  /* =========================================================
     (3) Snapping/detents
     - Accumulate allowed delta degrees into pendingDelta.
     - In rAF, convert degrees to detent steps (STEP_DEG each).
     - Each detent change triggers subtle vibrate + flash.
  ========================================================== */
  function stepPointerByDetents(deltaDeg){
    const steps = (deltaDeg / STEP_DEG) | 0; // trunc toward 0
    if (steps === 0) return deltaDeg;

    pointerIndex = (pointerIndex + steps) % SEGMENTS;
    if (pointerIndex < 0) pointerIndex += SEGMENTS;

    onDetent();
    renderPointerAndActive();

    return deltaDeg - steps * STEP_DEG; // remainder
  }

  function onDetent(){
    if (navigator.vibrate) navigator.vibrate(10);
    dial.classList.remove("snapFlash");
    void dial.offsetWidth;
    dial.classList.add("snapFlash");
  }

  function renderPointerAndActive(){
    const angle = pointerIndex * STEP_DEG;
    handEl.style.transform = `translate(-50%,-92%) rotate(${angle}deg)`;

    for (let i=0;i<wedgeEls.length;i++){
      wedgeEls[i].classList.toggle("active", i === pointerIndex);
    }
  }

  /* =========================================================
     (4) Lock handling and state flip
     - LOCK ALWAYS flips state (RED<->BLUE), regardless of correctness.
     - After flip, evaluate current pointerIndex vs correctIndex.
     - Correct: progress++ and advance to next question.
     - Wrong: progress=0 AND questionIndex=0 (Q1) immediately.
     - Flip happens regardless (next player continues after flip).
  ========================================================== */
  function flipState(){
    state = (state === "RED") ? "BLUE" : "RED";
    body.classList.toggle("state-blue", state === "BLUE");

    instructionEl.textContent = (state === "RED")
      ? "PASS TO CLOCKWISE PLAYER"
      : "PASS TO ANTI-CLOCKWISE PLAYER";

    renderArrow();
  }

  function handleLock(){
    if (unlocked) return;

    // Stronger haptic on LOCK
    if (navigator.vibrate) navigator.vibrate([40, 40, 70]);

    // Flip always
    flipState();

    const q = QUESTIONS[questionIndex];
    const isCorrect = (pointerIndex === q.correctIndex);

    if (isCorrect){
      progress += 1;
      if (progress >= 5){
        progress = 5;
        unlocked = true;
        showUnlocked();
      } else {
        questionIndex = Math.min(questionIndex + 1, QUESTIONS.length - 1);
      }
    } else {
      progress = 0;
      questionIndex = 0;
    }

    // Reset pointer position after each lock for clarity (unless unlocked)
    if (!unlocked) pointerIndex = 0;

    updateUI();
  }

  /* =========================================================
     (5) Reset logic and “SAFE UNLOCKED” modal
     - RESET returns to start state: RED, Q1, CODE 0, pointer 0, timer 00:00.
     - When unlocked, interaction is disabled until RESET.
  ========================================================== */
  function showUnlocked(){
    modal.classList.add("show");
  }
  function hideUnlocked(){
    modal.classList.remove("show");
  }

  function resetAll(){
    unlocked = false;
    hideUnlocked();
    state = "RED";
    questionIndex = 0;
    progress = 0;
    pointerIndex = 0;
    elapsedSec = 0;

    body.classList.remove("state-blue");
    updateTimerUI();
    updateUI();
  }

  function updateUI(){
    const q = QUESTIONS[questionIndex];

    qNumEl.textContent = `Q${questionIndex + 1}`;
    qTextEl.textContent = q.prompt;
    codeEl.textContent = `${progress} / 5`;

    instructionEl.textContent = (state === "RED")
      ? "PASS TO CLOCKWISE PLAYER"
      : "PASS TO ANTI-CLOCKWISE PLAYER";

    renderArrow();
    buildRingForQuestion(q);
    renderPointerAndActive();

    lockBtn.disabled = unlocked;
    lockBtn.style.opacity = unlocked ? 0.6 : 1;
  }

  function renderArrow(){
    // RED (clockwise): arrowhead on right. BLUE (anti-clockwise): arrowhead on left.
    if (state === "RED"){
      arrowPath.setAttribute("d", "M 40 30 Q 260 2 480 30");
      arrowHead.setAttribute("d", "M 470 20 L 482 30 L 468 34");
    } else {
      arrowPath.setAttribute("d", "M 480 30 Q 260 2 40 30");
      arrowHead.setAttribute("d", "M 50 20 L 38 30 L 52 34");
    }
  }

  // Build the fixed 10-segment ring (wedge separators + centered labels)
  function buildRingForQuestion(q){
    if (wedgeEls.length === 0){
      ringSvg.innerHTML = "";

      const cx = 500, cy = 500;
      const rOuter = 485;
      const rInner = 300;

      const rimOuter = svgEl("circle", {
        cx, cy, r: rOuter - 4,
        fill: "none",
        stroke: "rgba(255,255,255,.22)",
        "stroke-width": 10,
        opacity: 0.6
      });
      ringSvg.appendChild(rimOuter);

      const rimInner = svgEl("circle", {
        cx, cy, r: rInner + 4,
        fill: "none",
        stroke: "rgba(255,255,255,.20)",
        "stroke-width": 10,
        opacity: 0.55
      });
      ringSvg.appendChild(rimInner);

      // Wedges + texts
      for (let i=0;i<SEGMENTS;i++){
        const startDeg = i * STEP_DEG;
        const endDeg = (i+1) * STEP_DEG;

        const path = svgEl("path", {
          d: donutWedgePath(cx, cy, rInner, rOuter, startDeg, endDeg),
          class: `wedge ${i%2===0 ? "altA":"altB"}`
        });
        ringSvg.appendChild(path);
        wedgeEls.push(path);

        const midDeg = startDeg + STEP_DEG/2;
        const textR = (rInner + rOuter) / 2;
        const pos = polarToXY(cx, cy, textR, midDeg);

        const t = svgEl("text", {
          x: pos.x.toFixed(2),
          y: pos.y.toFixed(2),
          class: "segText",
          "data-i": String(i)
        });

        // Keep labels upright: flip 180deg on bottom half so text isn't upside down.
        const a = normalizeDeg(midDeg);
        const flip = (a > 90 && a < 270) ? 180 : 0;
        t.setAttribute("transform", `rotate(${flip} ${pos.x.toFixed(2)} ${pos.y.toFixed(2)})`);

        ringSvg.appendChild(t);
      }

      // Radial separators for distinct sectors
      for (let i=0;i<SEGMENTS;i++){
        const deg = i * STEP_DEG;
        const p1 = polarToXY(cx, cy, rInner, deg);
        const p2 = polarToXY(cx, cy, rOuter, deg);
        const line = svgEl("line", {
          x1: p1.x.toFixed(2),
          y1: p1.y.toFixed(2),
          x2: p2.x.toFixed(2),
          y2: p2.y.toFixed(2),
          stroke: "rgba(255,255,255,.20)",
          "stroke-width": 3,
          "stroke-linecap": "round"
        });
        ringSvg.appendChild(line);
      }
    }

    // Update labels (fixed positions; no shuffle)
    const texts = ringSvg.querySelectorAll("text.segText");
    for (let i=0;i<texts.length;i++){
      const idx = Number(texts[i].getAttribute("data-i"));
      const label = q.answers[idx] ?? "";
      texts[i].textContent = label;
      texts[i].classList.toggle("small", label.length >= 9);
    }
  }

  // SVG helpers
  function svgEl(tag, attrs){
    const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }
  function degToRad(deg){ return (deg - 90) * Math.PI / 180; } // -90 => 0deg at top
  function polarToXY(cx, cy, r, deg){
    const rad = degToRad(deg);
    return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
  }
  function donutWedgePath(cx, cy, rInner, rOuter, startDeg, endDeg){
    const p1 = polarToXY(cx, cy, rOuter, startDeg);
    const p2 = polarToXY(cx, cy, rOuter, endDeg);
    const p3 = polarToXY(cx, cy, rInner, endDeg);
    const p4 = polarToXY(cx, cy, rInner, startDeg);
    const largeArc = (endDeg - startDeg) > 180 ? 1 : 0;

    return [
      `M ${p1.x.toFixed(2)} ${p1.y.toFixed(2)}`,
      `A ${rOuter} ${rOuter} 0 ${largeArc} 1 ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`,
      `L ${p3.x.toFixed(2)} ${p3.y.toFixed(2)}`,
      `A ${rInner} ${rInner} 0 ${largeArc} 0 ${p4.x.toFixed(2)} ${p4.y.toFixed(2)}`,
      "Z"
    ].join(" ");
  }

  // rAF drag loop to keep movement smooth and avoid jitter
  function startRafIfNeeded(){
    if (rafActive) return;
    rafActive = true;

    const tick = () => {
      if (!dragging || unlocked){
        rafActive = false;
        pendingDelta = 0;
        return;
      }

      let d = pendingDelta;
      pendingDelta = 0;

      d = stepPointerByDetents(d);
      pendingDelta += d;

      requestAnimationFrame(tick);
    };

    requestAnimationFrame(tick);
  }

  function onPointerDown(clientX, clientY){
    if (unlocked) return;
    dragging = true;
    lastAngleDeg = angleFromPoint(clientX, clientY);
    pendingDelta = 0;
    startRafIfNeeded();
  }

  function onPointerMove(clientX, clientY){
    if (!dragging || unlocked) return;

    const ang = angleFromPoint(clientX, clientY);
    let d = signedAngleDelta(lastAngleDeg, ang);
    lastAngleDeg = ang;

    d = filterDeltaByDirection(d);
    pendingDelta += d;
  }

  function endDrag(){
    dragging = false;
    lastAngleDeg = null;
  }

  // Touch + mouse wiring
  dial.addEventListener("touchstart", (e) => {
    if (e.touches && e.touches.length){
      e.preventDefault();
      const t = e.touches[0];
      onPointerDown(t.clientX, t.clientY);
    }
  }, { passive: false });

  dial.addEventListener("touchmove", (e) => {
    if (e.touches && e.touches.length){
      e.preventDefault();
      const t = e.touches[0];
      onPointerMove(t.clientX, t.clientY);
    }
  }, { passive: false });

  dial.addEventListener("touchend", (e) => { e.preventDefault(); endDrag(); }, { passive: false });
  dial.addEventListener("touchcancel", (e) => { e.preventDefault(); endDrag(); }, { passive: false });

  dial.addEventListener("mousedown", (e) => {
    e.preventDefault();
    onPointerDown(e.clientX, e.clientY);
  });
  window.addEventListener("mousemove", (e) => onPointerMove(e.clientX, e.clientY));
  window.addEventListener("mouseup", () => endDrag());

  // Buttons
  lockBtn.addEventListener("click", () => handleLock());
  resetBtn.addEventListener("click", () => resetAll());

  // Timer
  function updateTimerUI(){
    const m = Math.floor(elapsedSec / 60);
    const s = elapsedSec % 60;
    timerEl.textContent = `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  }
  function startTimer(){
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      elapsedSec += 1;
      updateTimerUI();
    }, 1000);
  }

  // Init
  updateUI();
  startTimer();
})();
</script>
</body>
</html>
