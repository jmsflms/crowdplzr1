<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Countdown</title>

<style>
  html, body {
    margin:0;
    height:100%;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  #timer {
    color:#ff2a2a;
    font-family: monospace;
    font-size: clamp(60px, 12vw, 160px);
    font-weight: bold;
    letter-spacing: 0.08em;
    text-shadow: 0 0 25px rgba(255,0,0,0.4);
    user-select:none;
  }
</style>
</head>
<body>

<div id="timer">00:00:00</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2"

const supabase = createClient(
  "https://hhyfixoxwxmzncosmcqo.supabase.co",
  "sb_publishable_KWvHkZqW2aAipujklitrdg_C7bSBFce"
)

const timer = document.getElementById("timer")
let endTime = null
let interval = null

function pad(n){ return String(n).padStart(2,"0") }

function format(ms){
  ms = Math.max(0, ms)
  const total = Math.floor(ms/1000)
  const s = total % 60
  const m = Math.floor(total/60) % 60
  const h = Math.floor(total/3600)
  return `${pad(h)}:${pad(m)}:${pad(s)}`
}

function start(){
  if(interval) clearInterval(interval)
  interval = setInterval(()=>{
    if(!endTime) return
    const diff = new Date(endTime).getTime() - Date.now()
    timer.textContent = format(diff)
  }, 250)
}

async function load(){
  const { data } = await supabase
    .from("countdowns")
    .select("*")
    .eq("id","main")
    .maybeSingle()

  if(data){
    endTime = data.end_time
    start()
  }
}

await load()

supabase
  .channel("countdown-live")
  .on(
    "postgres_changes",
    { event:"*", schema:"public", table:"countdowns", filter:"id=eq.main" },
    payload => {
      endTime = payload.new.end_time
      start()
    }
  )
  .subscribe()
</script>

</body>
</html>
