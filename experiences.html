<!-- Play Trailer Button -->
<button onclick="openTrailer()" style="font-size:18px; padding:10px 20px;">Play Trailer</button>

<!-- Fullscreen Modal -->
<div id="trailerModal" style="
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  background:rgba(0,0,0,0.95);
  justify-content:center;
  align-items:center;
  z-index:9999;
  overflow:hidden;
  flex-direction:column;
">

  <!-- Video Player -->
  <video id="trailerVideo" style="max-height:100vh; width:auto;" controls autoplay playsinline>
    <source src="/assets/cloudplzr.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- Close Button -->
  <button onclick="closeTrailer()" style="
    position:absolute;
    top:20px;
    right:20px;
    font-size:32px;
    background:none;
    border:none;
    color:white;
    cursor:pointer;
  ">✖</button>
</div>

<script>
function openTrailer() {
  document.getElementById('trailerModal').style.display = 'flex';
  document.body.style.overflow = 'hidden'; // Disable page scroll
  const vid = document.getElementById('trailerVideo');
  vid.currentTime = 0;
  vid.play();
}

function closeTrailer() {
  document.getElementById('trailerModal').style.display = 'none';
  document.body.style.overflow = ''; // Re-enable page scroll
  const vid = document.getElementById('trailerVideo');
  vid.pause();
  vid.currentTime = 0;
}
</script>
