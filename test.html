<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloudplzr</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #000000;
    --card: #111111;
    --card-grad: radial-gradient(circle at top, #1b1b1b 0, #0b0b0b 55%, #050505 100%);
    --border: #1e1e1e;
    --text: #ffffff;
    --muted: #bbbbbb;
    --accent-blue: #4da3ff;
    --strike-red: #ff3b3b;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, sans-serif;
  }

  a { color: var(--text); }

  .page {
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 18px 40px;
  }

  /* HERO */

  .hero {
    text-align: left;
    padding-top: 42px;
    padding-bottom: 12px;
  }

  .hero-logo {
    font-size: 50px;
    font-weight: 800;
    margin-bottom: 8px;
    letter-spacing: 0.03em;
  }

  .hero-title {
    font-size: 36px;
    font-weight: 700;
    margin: 8px 0 14px;
    max-width: 720px;
  }

  .hero-subline {
    font-size: 16px;
    color: var(--muted);
    margin-bottom: 6px;
    max-width: 820px;
    line-height: 1.6;
  }

  .hero-subline b {
    color: #ffffff;
    font-weight: 600;
  }

  .hero-console {
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    color: var(--muted);
    margin-top: 14px;
    margin-bottom: 26px;
  }

  /* GRID & CARDS (desktop / tablet default) */

  .plzr-section {
    margin-top: 34px;
  }

  .plzr-carousel {
    position: relative;
  }

  .plzr-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 22px;
    margin: 32px 0 16px;
  }

  @media (max-width: 960px) {
    .plzr-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  .plzr-card {
    background: var(--card-grad);
    border-radius: 20px;
    border: 1px solid var(--border);
    padding: 24px 18px 30px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.7);
  }

  .plzr-category {
    text-align: center;
    font-size: 13px;
    font-family: "JetBrains Mono", monospace;
    color: var(--accent-blue);
    letter-spacing: 1.4px;
    margin-bottom: 12px;
  }

  .plzr-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .plzr-logo {
    height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
  }

  .plzr-logo img {
    max-height: 105px;      /* bigger logos */
    max-width: 210px;
    object-fit: contain;
    border-radius: 22px;     /* rounded lozenge look */
  }

  .plzr-stage {
    width: 100%;
    max-width: 260px;
  }

  .plzr-label {
    font-size: 16px;
    margin: 10px 0;
  }

  .plzr-label.bold {
    font-weight: 700;
  }

  .plzr-sub {
    margin-top: 6px;
    font-size: 13px;
    color: var(--muted);
  }

  .plzr-line {
    height: 60px;
    border-left: 2px solid rgba(255,255,255,0.5);
    margin: 0 auto;
    display: block;
    width: 0;
  }

  /* STRIKES FOR BROKEN COLUMN */

  .strike {
    position: relative;
  }

  .strike::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 52%;
    width: 80%;
    height: 5px;
    background: var(--strike-red);
    transform: translate(-50%, -50%) rotate(-8deg);
    border-radius: 6px;
  }

  /* CAROUSEL ARROWS (main grid) */

  .plzr-arrow {
    display: none;
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 30px;
    height: 30px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: rgba(0,0,0,0.7);
    color: #fff;
    font-size: 18px;
    line-height: 28px;
    text-align: center;
    cursor: pointer;
    padding: 0;
    z-index: 20;
  }

  .plzr-arrow-left { left: 4px; }
  .plzr-arrow-right { right: 4px; }

  .productions-section {
    margin: 30px 0 26px;
  }

    text-a
