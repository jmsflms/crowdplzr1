<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Song Guess</title>
  <style>
    :root{
      --bg:#ffffff;
      --fg:#111111;
      --muted:#444;
      --border:#111;
      --panel:#fff;

      /* Wordle-ish */
      --w-green:#6aaa64;
      --w-yellow:#c9b458;
      --w-gray:#d3d6da;

      --danger:#e06b6b;
      --shadow: 0 2px 0 rgba(0,0,0,.12);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font-family: "Clear Sans","Helvetica Neue",Arial,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .page{
      min-height:100%;
      display:flex;
      justify-content:center;
      padding:14px 12px 40px;
    }

    .wrap{
      width:min(760px, 100%);
    }

    .topbar{
      display:grid;
      grid-template-columns: 1fr auto 1fr;
      align-items:center;
      gap:10px;
      margin-bottom:10px;
    }

    .rules-link{
      justify-self:start;
      font-size:13px;
      color:#111;
      text-decoration: underline;
      cursor:pointer;
      user-select:none;
    }

    .title{
      justify-self:center;
      font-weight:900;
      letter-spacing:.18em;
      text-transform:uppercase;
      font-size:26px;
      margin:0;
      line-height:1;
    }

    .daybox{
      justify-self:end;
      display:flex;
      align-items:center;
      gap:8px;
      font-size:13px;
      color:var(--fg);
    }

    .daybox label{ font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    select{
      border:2px solid var(--border);
      border-radius:0;
      padding:8px 10px;
      background:#fff;
      color:#111;
      font-weight:800;
      min-width: 130px;
    }

    .panel{
      border:3px solid var(--border);
      border-radius:0;
      background:var(--panel);
      padding:16px 14px 14px;
    }

    .staff-wrap{
      padding:10px 6px 8px;
      border:2px solid transparent;
    }

    .staff-svg{
      width:100%;
      height:auto;
      display:block;
    }

    .controls{
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:center;
      margin-top:10px;
    }

    button{
      width:min(420px, 92vw);
      border:3px solid var(--border);
      border-radius:0;
      padding:14px 12px;
      font-weight:900;
      letter-spacing:.06em;
      text-transform:uppercase;
      cursor:pointer;
      color:#111;
      background:#fff;
      box-shadow: var(--shadow);
      touch-action: manipulation;
    }

    button:active{ transform: translateY(1px); box-shadow:none; }
    button:disabled{
      opacity:.45;
      cursor:not-allowed;
      box-shadow:none;
      transform:none;
    }

    .btn-green{ background: var(--w-green); color:#fff; }
    .btn-yellow{ background: var(--w-yellow); color:#111; }
    .btn-danger{ background: var(--danger); color:#111; }

    .guess-box{
      margin:14px auto 0;
      width:min(520px, 92vw);
      display:none;
      border-top:1px solid #ddd;
      padding-top:14px;
      text-align:center;
    }

    input[type="text"]{
      width:100%;
      border:3px solid var(--border);
      border-radius:0;
      padding:12px 10px;
      font-size:16px;
      font-weight:800;
      outline:none;
    }

   .guess-actions{
  width:min(420px, 92vw);
  margin:10px auto 0;
  display:flex;
  flex-direction:column;
  gap:10px;
  align-items:stretch;
}

.guess-actions button{
  width:100%;
}

    .msg{
      min-height:22px;
      margin-top:12px;
      text-align:center;
      font-weight:800;
      white-space: pre-line; /* enables \n\n spacing */
    }

    /* Rules drawer */
    .drawer-backdrop{
      position:fixed;
      inset:0;
      background: rgba(0,0,0,.25);
      display:none;
    }
    .drawer{
      position:fixed;
      top:0; left:0;
      height:100%;
      width:min(320px, 86vw);
      background:#fff;
      border-right:3px solid var(--border);
      transform: translateX(-105%);
      transition: transform 160ms ease;
      padding:14px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .drawer.open{ transform: translateX(0); }
    .drawer-backdrop.open{ display:block; }

    .drawer-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      border-bottom:1px solid #ddd;
      padding-bottom:10px;
    }
    .drawer-title{
      font-weight:900;
      letter-spacing:.12em;
      text-transform:uppercase;
      font-size:14px;
      margin:0;
    }
    .drawer-close{
      border:2px solid var(--border);
      border-radius:0;
      background:#fff;
      width:34px;
      height:34px;
      font-weight:900;
      cursor:pointer;
      box-shadow: var(--shadow);
    }
    .drawer-text{
      font-size:14px;
      line-height:1.35;
      color:#111;
      white-space:pre-line;
    }

    /* Overlay */
    .overlay{
      position:fixed;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      padding:16px;
      background: rgba(0,0,0,.30);
    }
    .overlay.open{ display:flex; }
    .modal{
      width:min(620px, 96vw);
      background:#fff;
      border:3px solid var(--border);
      border-radius:0;
      padding:16px;
    }
    .modal-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
    }
    .modal-title{
      margin:0;
      font-weight:900;
      font-size:22px;
      line-height:1.15;
    }
    .modal-close{
      border:2px solid var(--border);
      border-radius:0;
      background:#fff;
      width:34px;
      height:34px;
      font-weight:900;
      cursor:pointer;
      box-shadow: var(--shadow);
      flex:0 0 auto;
    }

    .share-card{
      margin-top:12px;
      border:3px solid var(--border);
      border-radius:0;
      padding:12px;
    }
    .share-caption{
      font-weight:900;
      letter-spacing:.06em;
      text-transform:uppercase;
      font-size:14px;
      margin:0 0 10px 0;
    }
    .share-preview{
      width:100%;
      display:block;
      border:2px solid #ddd;
      background:#fff;
    }
    .modal-actions{
      margin-top:12px;
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:center;
    }
    .hint{
      text-align:center;
      font-size:13px;
      color:var(--muted);
      min-height:18px;
    }

    @media (max-width: 420px){
      .title{ font-size:22px; }
      button{ padding:13px 12px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="wrap">

      <div class="topbar">
        <div class="rules-link" id="rulesLink">Rules</div>
        <h1 class="title">Song Guess</h1>
        <div class="daybox">
          <label for="daySelect">Day</label>
          <select id="daySelect" aria-label="Select day"></select>
        </div>
      </div>

      <div class="panel">
        <div class="staff-wrap">
          <svg id="staffSVG" class="staff-svg" viewBox="0 0 640 140" role="img" aria-label="Stave showing revealed notes">
          </svg>
        </div>

        <div class="controls">
          <button id="playBtn" class="btn-green">Play Notes</button>
          <button id="addBtn" class="btn-yellow">Add a Note</button>
          <button id="nameBtn" class="btn-green">Name the Song</button>
          <button id="giveBtn" class="btn-danger">Give up</button>
        </div>

        <div class="guess-box" id="guessBox">
          <input id="guessInput" type="text" placeholder="Type the song name exactly…" autocomplete="off" />
          <div class="guess-actions">
            <button id="submitGuessBtn" class="btn-green">Submit</button>
            <button id="cancelGuessBtn">Cancel</button>
          </div>
        </div>

        <div class="msg" id="msg"></div>
      </div>

    </div>
  </div>

  <!-- Rules drawer -->
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <p class="drawer-title">Rules</p>
      <button class="drawer-close" id="drawerClose" aria-label="Close rules">X</button>
    </div>
    <div class="drawer-text">
Guess the tune in the fewest notes you can.
Name must match our database.
Ensure your phone volume is up, and not on silent.
Refresh if issues.
    </div>
  </aside>

  <!-- Win / giveup overlay -->
  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 class="modal-title" id="modalTitle">You got it in X notes.</h2>
        <button class="modal-close" id="modalClose" aria-label="Close">X</button>
      </div>

      <div class="share-card">
        <p class="share-caption" id="shareCaption">SONG GUESS — X notes</p>
        <canvas id="shareCanvas" class="share-preview" width="600" height="220"></canvas>
      </div>

      <div class="modal-actions">
        <button class="btn-green" id="copyBtn">Copy score to share with friends</button>
        <div class="hint" id="copyHint"></div>
      </div>
    </div>
  </div>

<script>
(() => {
  /*********************************************************************
   * SONG CONFIG (EDIT HERE)
   *********************************************************************/
  const START_DATE_UTC = "2026-02-06"; // YYYY-MM-DD

  // Each song must have EXACTLY 12 notes: {m: MIDI, d: beats}
  const SONGS = [
    {
      title: "Ode to Joy",
      notes: [
        {m:64,d:1},{m:64,d:1},{m:65,d:1},{m:67,d:1},{m:67,d:1},{m:65,d:1},
        {m:64,d:1},{m:62,d:1},{m:60,d:1},{m:60,d:1},{m:62,d:1},{m:64,d:1},
      ]
    },
    {
      title: "Beethoven 5th",
      notes: [
        {m:67,d:0.5},{m:67,d:0.5},{m:67,d:0.5},{m:63,d:1.5},
        {m:66,d:0.5},{m:66,d:0.5},{m:66,d:0.5},{m:62,d:1.5},
        {m:67,d:0.5},{m:67,d:0.5},{m:67,d:0.5},{m:63,d:1.5},
      ]
    }
  ];

  const MAX_NOTES = 12;

  /*********************************************************************
   * VALIDATION (pads/clamps with console warning)
   *********************************************************************/
  for (const s of SONGS) {
    if (!Array.isArray(s.notes)) s.notes = [];
    if (s.notes.length !== MAX_NOTES) {
      console.warn(`[SongGuess] "${s.title}" has ${s.notes.length} notes; expected ${MAX_NOTES}. Auto-adjusting.`);
      if (s.notes.length === 0) {
        s.notes = Array.from({length: MAX_NOTES}, () => ({m:64,d:1}));
      } else if (s.notes.length < MAX_NOTES) {
        const last = s.notes[s.notes.length - 1];
        while (s.notes.length < MAX_NOTES) s.notes.push({m:last.m, d:last.d});
      } else {
        s.notes = s.notes.slice(0, MAX_NOTES);
      }
    }
  }

  /*********************************************************************
   * DOM
   *********************************************************************/
  const staffSVG = document.getElementById("staffSVG");
  const playBtn = document.getElementById("playBtn");
  const addBtn = document.getElementById("addBtn");
  const nameBtn = document.getElementById("nameBtn");
  const giveBtn = document.getElementById("giveBtn");
  const guessBox = document.getElementById("guessBox");
  const guessInput = document.getElementById("guessInput");
  const submitGuessBtn = document.getElementById("submitGuessBtn");
  const cancelGuessBtn = document.getElementById("cancelGuessBtn");
  const msgEl = document.getElementById("msg");
  const daySelect = document.getElementById("daySelect");

  const rulesLink = document.getElementById("rulesLink");
  const drawerBackdrop = document.getElementById("drawerBackdrop");
  const drawer = document.getElementById("drawer");
  const drawerClose = document.getElementById("drawerClose");

  const overlay = document.getElementById("overlay");
  const modalClose = document.getElementById("modalClose");
  const modalTitle = document.getElementById("modalTitle");
  const shareCaption = document.getElementById("shareCaption");
  const shareCanvas = document.getElementById("shareCanvas");
  const copyBtn = document.getElementById("copyBtn");
  const copyHint = document.getElementById("copyHint");

  /*********************************************************************
   * DATE / DAY HELPERS
   *********************************************************************/
  function parseUTCDate(yyyy_mm_dd){
    const [y,m,d] = yyyy_mm_dd.split("-").map(Number);
    return new Date(Date.UTC(y, m-1, d, 0,0,0));
  }
  function todayUTC(){
    const now = new Date();
    return new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 0,0,0));
  }
  function dayIndexFromDate(dateUTC){
    const start = parseUTCDate(START_DATE_UTC);
    const diffMs = dateUTC.getTime() - start.getTime();
    return Math.floor(diffMs / (24*60*60*1000));
  }

  /*********************************************************************
   * STATE
   *********************************************************************/
  let selectedDayIdx = 0;
  let revealed = 1;
  let solved = false;
  let gaveUp = false;

  function songForDay(dayIdx){
    const i = ((dayIdx % SONGS.length) + SONGS.length) % SONGS.length;
    return SONGS[i];
  }

  function storageKey(dayIdx){
    return `songguess:v4:${START_DATE_UTC}:day:${dayIdx}`;
  }
  function loadProgress(dayIdx){
    const raw = localStorage.getItem(storageKey(dayIdx));
    if (!raw) return null;
    try { return JSON.parse(raw); } catch { return null; }
  }
  function saveProgress(){
    localStorage.setItem(storageKey(selectedDayIdx), JSON.stringify({revealed, solved, gaveUp}));
  }

  function setStatusMessageFromState(){
    const song = songForDay(selectedDayIdx);
    const dayLabel = `Day ${selectedDayIdx + 1}: ${song.title}.`;

    if (solved){
      msgEl.textContent =
        `${dayLabel} Solved in ${revealed} note${revealed===1?"":"s"}.\n\n` +
        `Come back tomorrow for a new song.`;
      return;
    }

    if (gaveUp){
      msgEl.textContent =
        `${dayLabel} You gave up after ${revealed} note${revealed===1?"":"s"}.\n\n` +
        `Come back tomorrow for a new song.`;
      return;
    }

    msgEl.textContent = "";
  }

  /*********************************************************************
   * RULES DRAWER
   *********************************************************************/
  function openDrawer(){
    drawerBackdrop.classList.add("open");
    drawer.classList.add("open");
    drawer.setAttribute("aria-hidden","false");
  }
  function closeDrawer(){
    drawerBackdrop.classList.remove("open");
    drawer.classList.remove("open");
    drawer.setAttribute("aria-hidden","true");
  }
  rulesLink.addEventListener("click", openDrawer);
  drawerClose.addEventListener("click", closeDrawer);
  drawerBackdrop.addEventListener("click", closeDrawer);

  /*********************************************************************
   * STAFF RENDERING (SVG)
   *********************************************************************/
  const Staff = {
    vbW: 640,
    vbH: 140,
    left: 40,
    right: 600,
    topLineY: 44,
    lineGap: 10,
    noteR: 8,
    stemLen: 28,
    semitoneStep: 5,
    slotCount: MAX_NOTES,
    slotStartX: 70,
    slotEndX: 590,
  };

  function midiToY(midi){
    const bottomLineY = Staff.topLineY + Staff.lineGap*4; // E4 line
    const delta = midi - 64;
    return bottomLineY - (delta * Staff.semitoneStep);
  }

  function slotX(i){
    const t = (Staff.slotCount === 1) ? 0 : (i / (Staff.slotCount - 1));
    return Staff.slotStartX + t*(Staff.slotEndX - Staff.slotStartX);
  }

  function clearSVG(el){
    while (el.firstChild) el.removeChild(el.firstChild);
  }

  function svgEl(tag, attrs){
    const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const [k,v] of Object.entries(attrs || {})) el.setAttribute(k, String(v));
    return el;
  }

  function drawStaffBase(svg){
    for (let i=0;i<5;i++){
      const y = Staff.topLineY + i*Staff.lineGap;
      svg.appendChild(svgEl("line", {
        x1: Staff.left, y1: y, x2: Staff.right, y2: y,
        stroke:"#111", "stroke-width":"2"
      }));
    }

    svg.appendChild(svgEl("text", {
      x: Staff.left - 18,
      y: Staff.topLineY + Staff.lineGap*4 + 4,
      fill:"#111",
      "font-size":"22",
      "font-weight":"900"
    })).textContent = "𝄞";
  }

  function drawLedgerLines(svg, x, y){
    const topY = Staff.topLineY;
    const bottomY = Staff.topLineY + Staff.lineGap*4;
    const ledgerHalf = 14;

    if (y < topY){
      for (let ly = topY - Staff.lineGap; ly >= y - 1; ly -= Staff.lineGap){
        svg.appendChild(svgEl("line", {
          x1: x - ledgerHalf, y1: ly, x2: x + ledgerHalf, y2: ly,
          stroke:"#111", "stroke-width":"2"
        }));
      }
    } else if (y > bottomY){
      for (let ly = bottomY + Staff.lineGap; ly <= y + 1; ly += Staff.lineGap){
        svg.appendChild(svgEl("line", {
          x1: x - ledgerHalf, y1: ly, x2: x + ledgerHalf, y2: ly,
          stroke:"#111", "stroke-width":"2"
        }));
      }
    }
  }

  function drawNote(svg, x, y){
    drawLedgerLines(svg, x, y);

    svg.appendChild(svgEl("circle", {
      cx:x, cy:y, r:Staff.noteR,
      fill:"var(--w-yellow)",
      stroke:"#111",
      "stroke-width":"2"
    }));

    const stemX = x + Staff.noteR - 1;
    svg.appendChild(svgEl("line", {
      x1: stemX, y1: y, x2: stemX, y2: y - Staff.stemLen,
      stroke:"#111", "stroke-width":"2"
    }));
  }

  function renderStaff(revealedCount){
    clearSVG(staffSVG);
    drawStaffBase(staffSVG);

    const song = songForDay(selectedDayIdx);
    const notes = song.notes;

    for (let i=0;i<MAX_NOTES;i++){
      const x = slotX(i);
      if (i < revealedCount){
        const y = midiToY(notes[i].m);
        drawNote(staffSVG, x, y);
      } else {
        staffSVG.appendChild(svgEl("circle", {
          cx:x, cy: Staff.topLineY + Staff.lineGap*2,
          r: 2.5, fill:"#000", opacity:"0.10"
        }));
      }
    }
  }

  /*********************************************************************
   * SHARE CARD CANVAS
   *********************************************************************/
  function drawShareCardCanvas(statusText, revealedCount){
    const ctx = shareCanvas.getContext("2d");
    const W = shareCanvas.width, H = shareCanvas.height;

    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = "#fff";
    ctx.fillRect(0,0,W,H);

    ctx.strokeStyle = "#111";
    ctx.lineWidth = 3;
    ctx.strokeRect(1.5,1.5,W-3,H-3);

    ctx.fillStyle = "#111";
    ctx.font = "900 18px Arial, system-ui, -apple-system, Segoe UI, Roboto";
    ctx.textBaseline = "top";
    ctx.fillText(statusText, 18, 16);

    const staffLeft = 30;
    const staffRight = W - 30;
    const staffTop = 70;
    const lineGap = 12;
    const topLineY = staffTop;
    const bottomLineY = staffTop + lineGap*4;

    ctx.strokeStyle = "#111";
    ctx.lineWidth = 2;
    for (let i=0;i<5;i++){
      const y = topLineY + i*lineGap;
      ctx.beginPath();
      ctx.moveTo(staffLeft, y);
      ctx.lineTo(staffRight, y);
      ctx.stroke();
    }

    const semitoneStep = 6;
    function midiToYc(midi){
      const delta = midi - 64;
      return bottomLineY - (delta * semitoneStep);
    }
    function slotXc(i){
      const startX = staffLeft + 40;
      const endX = staffRight - 10;
      const t = (MAX_NOTES === 1) ? 0 : (i / (MAX_NOTES - 1));
      return startX + t*(endX - startX);
    }
    function drawLedger(x,y){
      const ledgerHalf = 16;
      if (y < topLineY){
        for (let ly = topLineY - lineGap; ly >= y - 1; ly -= lineGap){
          ctx.beginPath();
          ctx.moveTo(x - ledgerHalf, ly);
          ctx.lineTo(x + ledgerHalf, ly);
          ctx.stroke();
        }
      } else if (y > bottomLineY){
        for (let ly = bottomLineY + lineGap; ly <= y + 1; ly += lineGap){
          ctx.beginPath();
          ctx.moveTo(x - ledgerHalf, ly);
          ctx.lineTo(x + ledgerHalf, ly);
          ctx.stroke();
        }
      }
    }

    const song = songForDay(selectedDayIdx);
    const yellow = getComputedStyle(document.documentElement).getPropertyValue("--w-yellow").trim() || "#c9b458";

    for (let i=0;i<MAX_NOTES;i++){
      const x = slotXc(i);
      if (i < revealedCount){
        const y = midiToYc(song.notes[i].m);

        drawLedger(x,y);

        ctx.fillStyle = yellow;
        ctx.strokeStyle = "#111";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y, 9, 0, Math.PI*2);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x + 8, y);
        ctx.lineTo(x + 8, y - 34);
        ctx.stroke();
      } else {
        ctx.fillStyle = "rgba(0,0,0,0.10)";
        ctx.beginPath();
        ctx.arc(x, topLineY + lineGap*2, 3, 0, Math.PI*2);
        ctx.fill();
      }
    }
  }

  async function copyShareCardToClipboard(textFallback){
    copyHint.textContent = "";
    try {
      if (navigator.clipboard && window.ClipboardItem && shareCanvas.toBlob) {
        const blob = await new Promise((res) => shareCanvas.toBlob(res, "image/png"));
        if (!blob) throw new Error("blob failed");
        await navigator.clipboard.write([new ClipboardItem({"image/png": blob})]);
        copyHint.textContent = "Copied image to clipboard.";
        return;
      }
      throw new Error("no image clipboard");
    } catch {
      try {
        await navigator.clipboard.writeText(textFallback);
        copyHint.textContent = "Copied text to clipboard (image not supported).";
      } catch {
        copyHint.textContent = "Copy failed on this device/browser.";
      }
    }
  }

  /*********************************************************************
   * AUDIO (pleasant oscillator + short reverb)
   *********************************************************************/
  let audioCtx = null;
  let isPlaying = false;

  function ensureAudio(){
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  }

  function midiToFreq(m){ return 440 * Math.pow(2, (m - 69) / 12); }

  function makeConvolver(ctx, seconds=0.40, decay=2.4){
    const rate = ctx.sampleRate;
    const length = Math.max(1, Math.floor(rate * seconds));
    const impulse = ctx.createBuffer(2, length, rate);
    for (let ch=0; ch<2; ch++){
      const data = impulse.getChannelData(ch);
      for (let i=0; i<length; i++){
        const t = i / length;
        data[i] = (Math.random()*2 - 1) * Math.pow(1 - t, decay);
      }
    }
    const convolver = ctx.createConvolver();
    convolver.buffer = impulse;
    return convolver;
  }

  async function playNotes(){
    if (isPlaying) return;
    if (solved || gaveUp) return;

    ensureAudio();
    isPlaying = true;

    const ctx = audioCtx;
    const song = songForDay(selectedDayIdx);
    const tempo = 118;
    const beat = 60 / tempo;

    const master = ctx.createGain();
    master.gain.value = 0.95;

    const dry = ctx.createGain();
    dry.gain.value = 0.60;

    const wet = ctx.createGain();
    wet.gain.value = 0.35;

    const convolver = makeConvolver(ctx);

    dry.connect(master);
    convolver.connect(wet);
    wet.connect(master);
    master.connect(ctx.destination);

    const now = ctx.currentTime;
    let t = now + 0.02;

    disableGameplay();

    for (let i=0;i<revealed;i++){
      const {m,d} = song.notes[i];
      const dur = Math.max(0.06, d * beat);

      const osc1 = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      osc1.type = "triangle";
      osc2.type = "sine";
      osc1.frequency.value = midiToFreq(m);
      osc2.frequency.value = midiToFreq(m);

      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.35, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

      const lp = ctx.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.value = 2200;
      lp.Q.value = 0.7;

      osc1.connect(g);
      osc2.connect(g);
      g.connect(lp);
      lp.connect(dry);
      lp.connect(convolver);

      osc1.start(t);
      osc2.start(t);
      osc1.stop(t + dur + 0.02);
      osc2.stop(t + dur + 0.02);

      t += dur + 0.03;
    }

    const totalMs = Math.max(250, (t - now) * 1000);
    setTimeout(() => {
      isPlaying = false;
      if (!solved && !gaveUp) enableGameplay();
    }, totalMs);
  }

  function disableGameplay(){
    playBtn.disabled = true;
    addBtn.disabled = true;
    nameBtn.disabled = true;
    giveBtn.disabled = true;
    submitGuessBtn.disabled = true;
    cancelGuessBtn.disabled = true;
  }
  function enableGameplay(){
    playBtn.disabled = false;
    addBtn.disabled = false;
    nameBtn.disabled = false;
    giveBtn.disabled = false;
    submitGuessBtn.disabled = false;
    cancelGuessBtn.disabled = false;
  }

  /*********************************************************************
   * GUESS / WIN / GIVE UP
   *********************************************************************/
  function norm(s){
    return String(s || "").trim().replace(/\s+/g," ").toLowerCase();
  }

  function openOverlay(){
    overlay.classList.add("open");
    overlay.setAttribute("aria-hidden","false");
  }
  function closeOverlay(){
    overlay.classList.remove("open");
    overlay.setAttribute("aria-hidden","true");
    copyHint.textContent = "";
    // Immediately reflect solved/give-up status on the main screen (no manual refresh needed)
    setStatusMessageFromState();
  }
  modalClose.addEventListener("click", closeOverlay);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeOverlay(); });

  function showWin(){
    solved = true;
    saveProgress();
    guessBox.style.display = "none";

    const x = revealed;
    modalTitle.textContent = `You got it in ${x} note${x===1?"":"s"}.`;
    shareCaption.textContent = `SONG GUESS — ${x} notes`;
    drawShareCardCanvas(`SONG GUESS — ${x} notes`, x);
    openOverlay();

    playBtn.disabled = true;
    addBtn.disabled = true;
    nameBtn.disabled = true;
    giveBtn.disabled = true;

    renderStaff(revealed);

    // Set the post-game message immediately (so it appears even before closing)
    setStatusMessageFromState();
  }

  function showGiveUp(){
    gaveUp = true;
    saveProgress();
    guessBox.style.display = "none";

    const x = revealed;
    const answer = songForDay(selectedDayIdx).title;
    modalTitle.textContent = `You gave up after ${x} note${x===1?"":"s"}.`;
    shareCaption.textContent = `Answer: ${answer}`;
    drawShareCardCanvas(`SONG GUESS — ${x} notes`, x);
    openOverlay();

    playBtn.disabled = true;
    addBtn.disabled = true;
    nameBtn.disabled = true;
    giveBtn.disabled = true;

    renderStaff(revealed);
    setStatusMessageFromState();
  }

  async function submitGuess(){
    if (solved || gaveUp) return;

    const guess = norm(guessInput.value);
    if (!guess) return;

    const song = songForDay(selectedDayIdx);
    const answer = norm(song.title);

    if (guess === answer){
      showWin();
    } else {
      msgEl.textContent = "Nope. Try again (or add another note).";
      guessInput.select();
    }
  }

  /*********************************************************************
   * DAY PICKER
   *********************************************************************/
  function buildDayPicker(){
    const todayIdx = Math.max(0, dayIndexFromDate(todayUTC()));
    const maxIdx = todayIdx + 13;

    daySelect.innerHTML = "";
    for (let i=0;i<=maxIdx;i++){
      const opt = document.createElement("option");
      opt.value = String(i);
      opt.textContent = `Day ${i+1}`;
      daySelect.appendChild(opt);
    }

    daySelect.value = String(todayIdx);
    setDay(todayIdx);
  }

  function setDay(dayIdx){
    selectedDayIdx = dayIdx;

    revealed = 1;
    solved = false;
    gaveUp = false;

    const p = loadProgress(dayIdx);
    if (p){
      revealed = Math.max(1, Math.min(MAX_NOTES, Number(p.revealed) || 1));
      solved = !!p.solved;
      gaveUp = !!p.gaveUp;
    }

    guessBox.style.display = "none";
    guessInput.value = "";

    renderStaff(revealed);

    if (solved || gaveUp){
      playBtn.disabled = true;
      addBtn.disabled = true;
      nameBtn.disabled = true;
      giveBtn.disabled = true;
    } else {
      enableGameplay();
    }

    setStatusMessageFromState();
  }

  /*********************************************************************
   * EVENTS
   *********************************************************************/
  playBtn.addEventListener("click", () => { playNotes().catch(()=>{}); });

  addBtn.addEventListener("click", () => {
    if (solved || gaveUp) return;
    revealed = Math.min(MAX_NOTES, revealed + 1);
    renderStaff(revealed);
    msgEl.textContent = `Notes revealed: ${revealed}`;
    saveProgress();
  });

  nameBtn.addEventListener("click", () => {
    if (solved || gaveUp) return;
    guessBox.style.display = "block";
    guessInput.focus();
  });

  cancelGuessBtn.addEventListener("click", () => {
    guessBox.style.display = "none";
    guessInput.value = "";
    msgEl.textContent = "";
  });

  submitGuessBtn.addEventListener("click", () => { submitGuess().catch(()=>{}); });
  guessInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") submitGuess().catch(()=>{});
  });

  giveBtn.addEventListener("click", () => {
    if (solved || gaveUp) return;
    showGiveUp();
  });

  daySelect.addEventListener("change", () => {
    const idx = Number(daySelect.value);
    setDay(Number.isFinite(idx) ? idx : 0);
  });

  copyBtn.addEventListener("click", async () => {
    const x = revealed;
    const text = `SONG GUESS — ${x} notes`;
    await copyShareCardToClipboard(text);
  });

  /*********************************************************************
   * INIT
   *********************************************************************/
  buildDayPicker();
})();
</script>
