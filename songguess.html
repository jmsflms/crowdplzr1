<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Song Guess</title>
  <style>
    :root{
      --bg:#ffffff;
      --ink:#111;
      --border:#111;
      --panel:#fff;

      /* Wordle-ish */
      --green:#6aaa64;
      --yellow:#c9b458;
      --salmon:#e56b6f;

      --btnTextDark:#111;
      --btnTextLight:#fff;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:"Clear Sans","Helvetica Neue",Arial,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:geometricPrecision;
    }

    .topbar{
      width:min(760px,94vw);
      margin:18px auto 10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .topbar .left{
      display:flex;
      align-items:center;
      gap:14px;
      min-width:120px;
    }

    a.link{
      font-size:13px;
      color:#222;
      text-decoration:underline;
      text-underline-offset:2px;
      cursor:pointer;
      user-select:none;
      white-space:nowrap;
    }

    .title{
      flex:1;
      text-align:center;
      font-weight:900;
      letter-spacing:0.22em;
      font-size:26px;
      line-height:1;
      margin:0;
      text-transform:uppercase;
    }

    .right{
      min-width:160px;
      display:flex;
      justify-content:flex-end;
      gap:12px;
      align-items:center;
    }

    .daypick{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:800;
      letter-spacing:0.12em;
      text-transform:uppercase;
      font-size:13px;
    }

    select{
      border:2px solid var(--border);
      background:#fff;
      color:var(--ink);
      padding:8px 10px;
      font-weight:800;
      font-size:14px;
      letter-spacing:0.02em;
      outline:none;
      border-radius:0;
    }

    .wrap{
      width:min(760px,94vw);
      margin:0 auto 40px;
    }

    .panel{
      border:3px solid var(--border);
      background:var(--panel);
      padding:18px 14px 18px;
    }

    .staffWrap{ width:100%; margin:0 0 12px; }
    .staffBox{ width:100%; margin:0 auto; padding:6px 0 0; }

    .controls{
      width:min(520px,92vw);
      margin:0 auto;
      display:flex;
      flex-direction:column;
      gap:12px;
      align-items:stretch;
    }

    button.btn{
      width:100%;
      border:3px solid var(--border);
      border-radius:0;
      padding:14px 12px;
      font-weight:900;
      letter-spacing:0.18em;
      text-transform:uppercase;
      font-size:14px;
      cursor:pointer;
      background:#fff;
      color:var(--ink);
    }
    button.btn:active{transform:translateY(1px);}
    button.btn[disabled]{
      opacity:0.45;
      cursor:not-allowed;
      transform:none;
      filter:grayscale(0.15);
    }

    .btn.play, .btn.name{ background:var(--green); color:var(--btnTextLight); }
    .btn.add{ background:var(--yellow); color:var(--btnTextDark); }
    .btn.giveup{ background:var(--salmon); color:var(--btnTextDark); }

    .guessBox{
      width:min(520px,92vw);
      margin:14px auto 0;
      border:3px solid var(--border);
      padding:14px;
      display:none;
      background:#fff;
    }
    .guessBox.show{ display:block; }

    .guessBox input{
      width:100%;
      border:3px solid var(--border);
      border-radius:0;
      padding:14px 12px;
      font-size:18px;
      font-weight:800;
      outline:none;
    }

    .guess-actions{
      width:100%;
      margin:12px auto 0;
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:stretch;
    }
    .guess-actions button{ width:100%; }

    .status{
      width:min(520px,92vw);
      margin:14px auto 0;
      text-align:center;
      font-weight:900;
      font-size:20px;
      line-height:1.35;
      white-space:pre-line;
    }

    /* Error banner (if JS blows up) */
    .err{
      width:min(760px,94vw);
      margin:10px auto 0;
      border:3px solid var(--border);
      padding:10px 12px;
      font-weight:800;
      background:#fff3f3;
      display:none;
      white-space:pre-wrap;
    }
    .err.show{ display:block; }

    /* Drawer */
    .drawerBackdrop{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.25);
      display:none;
      z-index:50;
    }
    .drawerBackdrop.show{display:block;}

    .drawer{
      position:fixed;
      top:0; left:0;
      height:100%;
      width:min(360px,88vw);
      background:#fff;
      border-right:3px solid var(--border);
      transform:translateX(-102%);
      transition:transform 180ms ease-out;
      z-index:60;
      padding:18px 16px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .drawer.show{ transform:translateX(0); }

    .drawerTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .drawerTop h2{
      margin:0;
      font-size:16px;
      font-weight:900;
      letter-spacing:0.12em;
      text-transform:uppercase;
    }
    .drawerClose{
      border:3px solid var(--border);
      background:#fff;
      border-radius:0;
      font-weight:900;
      width:42px; height:38px;
      cursor:pointer;
    }
    .drawerText{
      font-size:16px;
      font-weight:700;
      line-height:1.55;
      white-space:pre-line;
      color:#111;
    }

    /* Overlay */
    .overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.35);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:80;
      padding:14px;
    }
    .overlay.show{ display:flex; }

    .modal{
      width:min(640px,96vw);
      background:#fff;
      border:3px solid var(--border);
      padding:16px 14px 14px;
      position:relative;
    }
    .modalClose{
      position:absolute;
      top:10px;
      right:10px;
      border:3px solid var(--border);
      background:#fff;
      border-radius:0;
      font-weight:900;
      width:42px; height:38px;
      cursor:pointer;
    }
    .modal h3{
      margin:0 48px 10px 0;
      font-size:22px;
      font-weight:900;
      line-height:1.2;
    }
    .modal .sub{
      margin:0 0 10px;
      color:#111;
      font-weight:800;
      font-size:14px;
      letter-spacing:0.04em;
    }

    .shareCard{
      border:3px solid var(--border);
      padding:12px;
      background:#fff;
      margin:10px 0 12px;
    }
    .shareTitle{
      font-weight:900;
      letter-spacing:0.14em;
      text-transform:uppercase;
      font-size:14px;
      margin:0 0 8px;
    }

    .copyBtn{
      border:3px solid var(--border);
      background:var(--green);
      color:#fff;
      border-radius:0;
      width:100%;
      padding:14px 12px;
      font-weight:900;
      letter-spacing:0.10em;
      text-transform:uppercase;
      cursor:pointer;
      font-size:13px;
    }

    .toast{
      margin-top:10px;
      font-weight:800;
      color:#111;
      font-size:13px;
      text-align:center;
      min-height:18px;
    }

    @media (max-width:420px){
      .title{ font-size:22px; }
      button.btn{ font-size:13px; padding:13px 10px; }
      .status{ font-size:18px; }
    }
  </style>
</head>
<body>
  <div class="err" id="errBox"></div>

  <div class="topbar">
    <div class="left">
      <a class="link" id="rulesLink">Rules</a>
    </div>

    <h1 class="title">SONG GUESS</h1>

    <div class="right">
      <a class="link" id="resetLink" title="Clears this day's saved progress (for testing)">Secret reset</a>
      <div class="daypick">
        <span>DAY</span>
        <select id="daySelect" aria-label="Select day"></select>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="panel">
      <div class="staffWrap">
        <div class="staffBox" id="staffHost" aria-label="Music staff"></div>
      </div>

      <div class="controls">
        <button class="btn play" id="btnPlay">Play Notes</button>
        <button class="btn add" id="btnAdd">Add a Note</button>
        <button class="btn name" id="btnName">Name the Song</button>
        <button class="btn giveup" id="btnGiveUp">Give up</button>
      </div>

      <div class="guessBox" id="guessBox">
        <input id="guessInput" type="text" inputmode="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Type the song title" />
        <div class="guess-actions">
          <button class="btn play" id="btnSubmitGuess">Submit</button>
          <button class="btn" id="btnCancelGuess">Cancel</button>
        </div>
      </div>

      <div class="status" id="statusText"></div>
    </div>
  </div>

  <!-- Rules Drawer -->
  <div class="drawerBackdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="drawer">
    <div class="drawerTop">
      <h2>Rules</h2>
      <button class="drawerClose" id="drawerClose" aria-label="Close rules">X</button>
    </div>
    <div class="drawerText" id="drawerText"></div>
  </aside>

  <!-- Win / GiveUp Overlay -->
  <div class="overlay" id="overlay" role="dialog" aria-modal="true">
    <div class="modal">
      <button class="modalClose" id="modalClose" aria-label="Close">X</button>
      <h3 id="modalHeadline">You got it in X notes.</h3>
      <div class="sub" id="modalSub"></div>

      <div class="shareCard" id="shareCard">
        <div class="shareTitle" id="shareTitle">SONG GUESS — X notes</div>
        <div id="shareStaffHost"></div>
      </div>

      <button class="copyBtn" id="btnCopy">Copy score to share with friends</button>
      <div class="toast" id="toast"></div>
    </div>
  </div>

<script>
(() => {
  const errBox = document.getElementById("errBox");
  function showErr(msg){
    errBox.textContent = String(msg || "Unknown error");
    errBox.classList.add("show");
  }
  window.addEventListener("error", (e) => {
    showErr(`JS error: ${e.message}\n${e.filename || ""}:${e.lineno || ""}`);
  });
  window.addEventListener("unhandledrejection", (e) => {
    showErr(`Promise error: ${e.reason && e.reason.message ? e.reason.message : e.reason}`);
  });

  /**************************************************************************
   *  SONG CONFIG (EDIT HERE)
   **************************************************************************/
  const START_DATE_UTC = "2026-02-06"; // YYYY-MM-DD
  const MAX_NOTES = 16;

  // Each song must have EXACTLY 16 notes: {m: MIDI, d: beats}
  const SONGS = [
    {
      title: "Ode to Joy",
      notes: [
        {m:64,d:1},{m:64,d:1},{m:65,d:1},{m:67,d:1},
        {m:67,d:1},{m:65,d:1},{m:64,d:1},{m:62,d:1},
        {m:60,d:1},{m:60,d:1},{m:62,d:1},{m:64,d:1},
        {m:64,d:1},{m:62,d:1},{m:62,d:1},{m:60,d:2},
      ]
    },
    {
      title: "Beethoven 5th",
      notes: [
        {m:67,d:0.5},{m:67,d:0.5},{m:67,d:0.5},{m:63,d:1.5},
        {m:66,d:0.5},{m:66,d:0.5},{m:66,d:0.5},{m:62,d:1.5},
        {m:67,d:0.5},{m:67,d:0.5},{m:67,d:0.5},{m:63,d:1.5},
        {m:66,d:0.5},{m:66,d:0.5},{m:66,d:0.5},{m:62,d:1.5},
      ]
    },
  ];

  /**************************************************************************
   *  RULES TEXT
   **************************************************************************/
  const RULES_TEXT =
`Guess the tune in the fewest notes you can.
Name must match our database.
Ensure your phone volume is up, and not on silent.
Refresh if issues.`;

  /**************************************************************************
   *  STORAGE (version bump avoids broken old states)
   **************************************************************************/
  const STORAGE_PREFIX = "songguess:v3:"; // <- bumping this fixes "many levels" caused by old bad localStorage
  function storageKeyForDay(day){ return `${STORAGE_PREFIX}${day}`; }
  function loadState(day){
    const raw = localStorage.getItem(storageKeyForDay(day));
    if(!raw) return null;
    try{ return JSON.parse(raw); } catch { return null; }
  }
  function saveState(day, st){
    localStorage.setItem(storageKeyForDay(day), JSON.stringify(st));
  }
  function clearState(day){
    localStorage.removeItem(storageKeyForDay(day));
  }
  function defaultState(){
    return { revealed: 1, status: "playing", solvedIn: null, gaveUpAt: null };
  }

  /**************************************************************************
   *  DATE HELPERS (UTC)
   **************************************************************************/
  const pad2 = (n) => String(n).padStart(2, "0");
  function parseUTCDate(yyyy_mm_dd){
    const [y,m,d] = yyyy_mm_dd.split("-").map(Number);
    return new Date(Date.UTC(y, (m-1), d, 0,0,0,0));
  }
  function dateToYYYYMMDDUTC(dt){
    return `${dt.getUTCFullYear()}-${pad2(dt.getUTCMonth()+1)}-${pad2(dt.getUTCDate())}`;
  }
  function addDaysUTC(dt, days){
    const x = new Date(dt.getTime());
    x.setUTCDate(x.getUTCDate() + days);
    return x;
  }
  function daysBetweenUTC(a,b){
    const ms = 24*60*60*1000;
    const ta = Date.UTC(a.getUTCFullYear(), a.getUTCMonth(), a.getUTCDate());
    const tb = Date.UTC(b.getUTCFullYear(), b.getUTCMonth(), b.getUTCDate());
    return Math.floor((tb - ta) / ms);
  }
  function todayUTCDate(){
    const now = new Date();
    return new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 0,0,0,0));
  }

  /**************************************************************************
   *  SONG VALIDATION (hard, predictable)
   **************************************************************************/
  function normalizeSongs(){
    for(const s of SONGS){
      if(!s || typeof s !== "object") continue;
      if(!Array.isArray(s.notes)) s.notes = [];
      if(s.notes.length !== MAX_NOTES){
        console.warn(`[SongGuess] "${s.title}" has ${s.notes.length} notes; expected ${MAX_NOTES}. Padding/trimming.`);
        if(s.notes.length > MAX_NOTES) s.notes = s.notes.slice(0, MAX_NOTES);
        while(s.notes.length < MAX_NOTES){
          const last = s.notes.length ? s.notes[s.notes.length-1] : {m:64,d:1};
          s.notes.push({m:last.m, d:last.d});
        }
      }
      s.notes = s.notes.map(n => ({
        m: Number.isFinite(n.m) ? n.m : 64,
        d: Number.isFinite(n.d) ? n.d : 1
      }));
    }
  }
  normalizeSongs();

  function normTitle(s){
    return String(s||"").trim().toLowerCase().replace(/\s+/g," ");
  }

  /**************************************************************************
   *  DOM
   **************************************************************************/
  const daySelect = document.getElementById("daySelect");
  const staffHost = document.getElementById("staffHost");

  const btnPlay = document.getElementById("btnPlay");
  const btnAdd = document.getElementById("btnAdd");
  const btnName = document.getElementById("btnName");
  const btnGiveUp = document.getElementById("btnGiveUp");

  const guessBox = document.getElementById("guessBox");
  const guessInput = document.getElementById("guessInput");
  const btnSubmitGuess = document.getElementById("btnSubmitGuess");
  const btnCancelGuess = document.getElementById("btnCancelGuess");

  const statusText = document.getElementById("statusText");

  const rulesLink = document.getElementById("rulesLink");
  const resetLink = document.getElementById("resetLink");

  const drawer = document.getElementById("drawer");
  const drawerBackdrop = document.getElementById("drawerBackdrop");
  const drawerClose = document.getElementById("drawerClose");
  const drawerText = document.getElementById("drawerText");

  const overlay = document.getElementById("overlay");
  const modalClose = document.getElementById("modalClose");
  const modalHeadline = document.getElementById("modalHeadline");
  const modalSub = document.getElementById("modalSub");
  const shareTitle = document.getElementById("shareTitle");
  const shareStaffHost = document.getElementById("shareStaffHost");
  const btnCopy = document.getElementById("btnCopy");
  const toast = document.getElementById("toast");

  drawerText.textContent = RULES_TEXT;

  /**************************************************************************
   *  DAY SELECTOR
   **************************************************************************/
  const startUTC = parseUTCDate(START_DATE_UTC);
  const todayUTC = todayUTCDate();
  const todayIndex = Math.max(1, daysBetweenUTC(startUTC, todayUTC) + 1);
  const maxIndex = todayIndex + 13;

  daySelect.innerHTML = "";
  for(let i=1;i<=maxIndex;i++){
    const opt = document.createElement("option");
    opt.value = String(i);
    opt.textContent = `Day ${i}`;
    daySelect.appendChild(opt);
  }
  daySelect.value = String(todayIndex);

  function dayIndexToDateStr(dayIndex){
    return dateToYYYYMMDDUTC(addDaysUTC(startUTC, dayIndex - 1));
  }
  function pickSongForDay(dayIndex){
    if(!SONGS.length){
      return { title:"(No songs configured)", notes: Array.from({length:MAX_NOTES}, () => ({m:64,d:1})) };
    }
    return SONGS[(dayIndex - 1) % SONGS.length];
  }

  /**************************************************************************
   *  STAFF RENDER (SVG)
   **************************************************************************/
  function buildStaffSVG({notes, shownCount, width=700, height=120, slots=MAX_NOTES}){
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("width","100%");
    svg.setAttribute("viewBox",`0 0 ${width} ${height}`);
    svg.setAttribute("preserveAspectRatio","xMidYMid meet");
    svg.setAttribute("role","img");

    const css = getComputedStyle(document.documentElement);
    const yellow = (css.getPropertyValue("--yellow").trim() || "#c9b458");
    const ink = "#111";

    const paddingX = 34;
    const showClef = true;

    const lineGap = 10;
    const topLineY = 28;
    const bottomLineY = topLineY + 4*lineGap;

    const staffLeft = paddingX + (showClef ? 18 : 0);
    const staffRight = width - paddingX;
    const staffWidth = staffRight - staffLeft;

    const semitoneStepPx = 4; // stable mapping

    const slotXs = [];
    for(let i=0;i<slots;i++){
      const t = (slots===1) ? 0.5 : (i/(slots-1));
      slotXs.push(staffLeft + t*staffWidth);
    }

    function yForMidi(m){ return bottomLineY - (m - 64) * semitoneStepPx; }

    function ledgerYsFor(y){
      const ys = [];
      const above = y < topLineY - lineGap*0.6;
      const below = y > bottomLineY + lineGap*0.6;
      if(!above && !below) return ys;
      const k = Math.round((y - topLineY) / lineGap);
      if(above){
        for(let kk=k; kk<=-1; kk++) ys.push(topLineY + kk*lineGap);
      }else{
        for(let kk=5; kk<=k; kk++) ys.push(topLineY + kk*lineGap);
      }
      return Array.from(new Set(ys));
    }

    // staff lines
    for(let i=0;i<5;i++){
      const y = topLineY + i*lineGap;
      const line = document.createElementNS(ns, "line");
      line.setAttribute("x1", staffLeft);
      line.setAttribute("x2", staffRight);
      line.setAttribute("y1", y);
      line.setAttribute("y2", y);
      line.setAttribute("stroke", ink);
      line.setAttribute("stroke-width", "2");
      svg.appendChild(line);
    }

    // clef
    if(showClef){
      const clef = document.createElementNS(ns, "text");
      clef.setAttribute("x", paddingX);
      clef.setAttribute("y", bottomLineY + 6);
      clef.setAttribute("font-size", "26");
      clef.setAttribute("font-weight", "700");
      clef.setAttribute("fill", ink);
      clef.textContent = "𝄞";
      svg.appendChild(clef);
    }

    // notes
    const rx = 9, ry = 7, stemH = 32;
    const count = Math.min(shownCount|0, slots, notes.length);

    for(let i=0;i<count;i++){
      const n = notes[i];
      const x = slotXs[i];
      const y = yForMidi(n.m);

      for(const ly of ledgerYsFor(y)){
        const ll = document.createElementNS(ns, "line");
        ll.setAttribute("x1", x-14);
        ll.setAttribute("x2", x+14);
        ll.setAttribute("y1", ly);
        ll.setAttribute("y2", ly);
        ll.setAttribute("stroke", ink);
        ll.setAttribute("stroke-width", "2");
        svg.appendChild(ll);
      }

      const stem = document.createElementNS(ns, "line");
      stem.setAttribute("x1", x + rx - 1);
      stem.setAttribute("x2", x + rx - 1);
      stem.setAttribute("y1", y);
      stem.setAttribute("y2", y - stemH);
      stem.setAttribute("stroke", ink);
      stem.setAttribute("stroke-width", "3");
      svg.appendChild(stem);

      const head = document.createElementNS(ns, "ellipse");
      head.setAttribute("cx", x);
      head.setAttribute("cy", y);
      head.setAttribute("rx", rx);
      head.setAttribute("ry", ry);
      head.setAttribute("fill", yellow);
      head.setAttribute("stroke", ink);
      head.setAttribute("stroke-width", "3");
      svg.appendChild(head);
    }

    return svg;
  }

  function renderStaffInto(el, songNotes, shownCount){
    el.innerHTML = "";
    el.appendChild(buildStaffSVG({notes:songNotes, shownCount}));
  }

  /**************************************************************************
   *  SHARE CANVAS
   **************************************************************************/
  function drawShareCardToCanvas({songTitleText, shownCount, notes, width=900, height=360}){
    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext("2d");

    const css = getComputedStyle(document.documentElement);
    const yellow = (css.getPropertyValue("--yellow").trim() || "#c9b458");
    const ink = "#111";
    const borderW = 6;

    ctx.fillStyle = "#fff";
    ctx.fillRect(0,0,width,height);

    ctx.strokeStyle = ink;
    ctx.lineWidth = borderW;
    ctx.strokeRect(borderW/2, borderW/2, width-borderW, height-borderW);

    ctx.fillStyle = ink;
    ctx.font = "900 34px Arial, Helvetica, sans-serif";
    ctx.textBaseline = "top";
    ctx.fillText(songTitleText, 40, 32);

    const staffTop = 120;
    const lineGap = 18;
    const topLineY = staffTop;
    const bottomLineY = topLineY + 4*lineGap;

    const paddingX = 60;
    const clefX = paddingX;
    const staffLeft = clefX + 24;
    const staffRight = width - paddingX;
    const staffWidth = staffRight - staffLeft;

    ctx.strokeStyle = ink;
    ctx.lineWidth = 4;
    for(let i=0;i<5;i++){
      const y = topLineY + i*lineGap;
      ctx.beginPath();
      ctx.moveTo(staffLeft, y);
      ctx.lineTo(staffRight, y);
      ctx.stroke();
    }

    ctx.fillStyle = ink;
    ctx.font = "700 46px Arial, Helvetica, sans-serif";
    ctx.fillText("𝄞", clefX, bottomLineY - 42);

    const semitoneStepPx = 7;
    const noteRx = 16, noteRy = 13, stemH = 62;

    const slotXs = [];
    for(let i=0;i<MAX_NOTES;i++){
      const t = (MAX_NOTES===1) ? 0.5 : (i/(MAX_NOTES-1));
      slotXs.push(staffLeft + t*staffWidth);
    }

    function yForMidi(m){ return bottomLineY - (m - 64) * semitoneStepPx; }
    function ledgerYsFor(y){
      const ys = [];
      const above = y < topLineY - lineGap*0.6;
      const below = y > bottomLineY + lineGap*0.6;
      if(!above && !below) return ys;
      const k = Math.round((y - topLineY) / lineGap);
      if(above){
        for(let kk=k; kk<=-1; kk++) ys.push(topLineY + kk*lineGap);
      }else{
        for(let kk=5; kk<=k; kk++) ys.push(topLineY + kk*lineGap);
      }
      return Array.from(new Set(ys));
    }

    const count = Math.min(shownCount|0, MAX_NOTES, notes.length);
    for(let i=0;i<count;i++){
      const n = notes[i];
      const x = slotXs[i];
      const y = yForMidi(n.m);

      for(const ly of ledgerYsFor(y)){
        ctx.beginPath();
        ctx.moveTo(x - 26, ly);
        ctx.lineTo(x + 26, ly);
        ctx.stroke();
      }

      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(x + noteRx - 2, y);
      ctx.lineTo(x + noteRx - 2, y - stemH);
      ctx.stroke();

      ctx.fillStyle = yellow;
      ctx.strokeStyle = ink;
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.ellipse(x, y, noteRx, noteRy, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.stroke();
    }

    return canvas;
  }

  /**************************************************************************
   *  AUDIO (more robust chain)
   **************************************************************************/
  let audioCtx=null, master=null, dryGain=null, wetGain=null, reverb=null, comp=null;

  function makeImpulseResponse(ctx, durationSec, decay){
    const rate = ctx.sampleRate;
    const length = Math.floor(rate * durationSec);
    const impulse = ctx.createBuffer(2, length, rate);
    for(let ch=0; ch<2; ch++){
      const data = impulse.getChannelData(ch);
      for(let i=0;i<length;i++){
        const t = i/length;
        data[i] = (Math.random()*2-1) * Math.pow(1 - t, decay);
      }
    }
    return impulse;
  }

  function ensureAudio(){
    if(audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    master = audioCtx.createGain();
    master.gain.value = 0.95;

    comp = audioCtx.createDynamicsCompressor();
    comp.threshold.value = -20;
    comp.knee.value = 18;
    comp.ratio.value = 4;
    comp.attack.value = 0.005;
    comp.release.value = 0.12;

    master.connect(comp);
    comp.connect(audioCtx.destination);

    dryGain = audioCtx.createGain();
    wetGain = audioCtx.createGain();
    dryGain.gain.value = 0.9;
    wetGain.gain.value = 0.35;

    dryGain.connect(master);
    wetGain.connect(master);

    reverb = audioCtx.createConvolver();
    reverb.buffer = makeImpulseResponse(audioCtx, 1.0, 2.3);
    reverb.connect(wetGain);
  }

  function midiToFreq(m){ return 440 * Math.pow(2, (m - 69) / 12); }

  function playSequence(seq){
    ensureAudio();
    if(audioCtx.state === "suspended") audioCtx.resume();

    const now = audioCtx.currentTime;
    const bpm = 105;
    const secPerBeat = 60 / bpm;
    let t = now + 0.02;

    for(const n of seq){
      const dur = Math.max(0.06, (n.d || 1) * secPerBeat);
      const freq = midiToFreq(n.m);

      const oscA = audioCtx.createOscillator();
      const oscB = audioCtx.createOscillator();
      oscA.type = "triangle";
      oscB.type = "sine";
      oscA.frequency.setValueAtTime(freq, t);
      oscB.frequency.setValueAtTime(freq*0.5, t);

      const filt = audioCtx.createBiquadFilter();
      filt.type = "lowpass";
      filt.frequency.setValueAtTime(2200, t);
      filt.Q.setValueAtTime(0.7, t);

      const env = audioCtx.createGain();
      env.gain.setValueAtTime(0.0001, t);
      env.gain.exponentialRampToValueAtTime(0.7, t + 0.012);
      env.gain.exponentialRampToValueAtTime(0.0001, t + dur);

      oscA.connect(filt);
      oscB.connect(filt);
      filt.connect(env);

      env.connect(dryGain);
      env.connect(reverb);

      oscA.start(t);
      oscB.start(t);
      oscA.stop(t + dur + 0.02);
      oscB.stop(t + dur + 0.02);

      t += dur + 0.015;
    }
  }

  /**************************************************************************
   *  GAME STATE
   **************************************************************************/
  let currentDayIndex = Number(daySelect.value);
  let currentDateStr = dayIndexToDateStr(currentDayIndex);
  let currentSong = pickSongForDay(currentDayIndex);
  let state = loadState(currentDateStr) || defaultState();

  function persist(){ saveState(currentDateStr, state); }
  function isOver(){ return state.status === "solved" || state.status === "gaveup"; }
  function revealedCount(){ return Math.max(1, Math.min(MAX_NOTES, Number(state.revealed) || 1)); }

  function setStatusMessage(){
    const dayLabel = `Day ${currentDayIndex}`;
    if(state.status === "solved"){
      statusText.textContent = `${dayLabel}: ${currentSong.title}. Solved in ${state.solvedIn} notes.\n\nCome back tomorrow for a new song.`;
    } else if(state.status === "gaveup"){
      statusText.textContent = `${dayLabel}: ${currentSong.title}. You gave up after ${state.gaveUpAt} notes.\n\nCome back tomorrow for a new song.`;
    } else {
      statusText.textContent = "";
    }
  }

  function updateButtons(){
    const over = isOver();
    const rev = revealedCount();
    btnPlay.disabled = false;                 // always
    btnAdd.disabled = over || (rev >= MAX_NOTES);
    btnName.disabled = over;
    btnGiveUp.disabled = over;
    if(over) guessBox.classList.remove("show");
  }

  function render(){
    renderStaffInto(staffHost, currentSong.notes, revealedCount());
    setStatusMessage();
    updateButtons();
  }

  function openGuess(){
    if(isOver()) return;
    guessBox.classList.add("show");
    guessInput.value = "";
    setTimeout(() => guessInput.focus(), 0);
  }
  function closeGuess(){ guessBox.classList.remove("show"); }

  /**************************************************************************
   *  OVERLAY
   **************************************************************************/
  let lastShareCanvas = null;

  function showOverlay(kind){
    toast.textContent = "";
    const rev = revealedCount();
    const dayLabel = `Day ${currentDayIndex}`;
    const title = currentSong.title;

    // Ensure the main page message is updated immediately (even while overlay is open)
    setStatusMessage();

    if(kind === "solved"){
      modalHeadline.textContent = `You got it in ${state.solvedIn} notes.`;
      modalSub.textContent = `${dayLabel}: ${title}`;
      shareTitle.textContent = `SONG GUESS — ${state.solvedIn} notes`;
      shareStaffHost.innerHTML = "";
      shareStaffHost.appendChild(buildStaffSVG({notes: currentSong.notes, shownCount: state.solvedIn}));
      lastShareCanvas = drawShareCardToCanvas({
        songTitleText: `SONG GUESS — ${state.solvedIn} notes`,
        shownCount: state.solvedIn,
        notes: currentSong.notes
      });
    } else {
      modalHeadline.textContent = `You gave up after ${state.gaveUpAt} notes.`;
      modalSub.textContent = `Answer: ${title}`;
      shareTitle.textContent = `SONG GUESS — ${rev} notes`;
      shareStaffHost.innerHTML = "";
      shareStaffHost.appendChild(buildStaffSVG({notes: currentSong.notes, shownCount: rev}));
      lastShareCanvas = drawShareCardToCanvas({
        songTitleText: `SONG GUESS — ${rev} notes`,
        shownCount: rev,
        notes: currentSong.notes
      });
    }
    overlay.classList.add("show");
  }

  function hideOverlay(){
    overlay.classList.remove("show");
    render();
  }

  async function copyShare(){
    toast.textContent = "";
    const rev = revealedCount();
    const notesCount = (state.status === "solved") ? state.solvedIn : rev;
    const txt = `SONG GUESS — ${notesCount} notes`;

    try{
      if(!lastShareCanvas) throw new Error("no canvas");
      const blob = await new Promise((res) => lastShareCanvas.toBlob(res, "image/png"));
      if(!blob) throw new Error("blob failed");
      if(navigator.clipboard && window.ClipboardItem){
        const item = new ClipboardItem({ "image/png": blob });
        await navigator.clipboard.write([item]);
        toast.textContent = "Copied image to clipboard.";
        return;
      }
      throw new Error("image clipboard not supported");
    } catch {
      try{
        await navigator.clipboard.writeText(txt);
        toast.textContent = "Copied text to clipboard (image not supported here).";
      } catch {
        toast.textContent = "Copy failed on this browser.";
      }
    }
  }

  /**************************************************************************
   *  EVENTS
   **************************************************************************/
  function openDrawer(){
    drawerBackdrop.classList.add("show");
    drawer.classList.add("show");
  }
  function closeDrawer(){
    drawerBackdrop.classList.remove("show");
    drawer.classList.remove("show");
  }
  rulesLink.addEventListener("click", openDrawer);
  drawerClose.addEventListener("click", closeDrawer);
  drawerBackdrop.addEventListener("click", closeDrawer);

  resetLink.addEventListener("click", (e) => {
    e.preventDefault();
    clearState(currentDateStr);
    state = defaultState();
    persist();
    render();
  });

  daySelect.addEventListener("change", () => {
    currentDayIndex = Number(daySelect.value);
    currentDateStr = dayIndexToDateStr(currentDayIndex);
    currentSong = pickSongForDay(currentDayIndex);
    state = loadState(currentDateStr) || defaultState();
    closeGuess();
    hideOverlay();
    render();
  });

  btnPlay.addEventListener("click", () => {
    const count = isOver() ? MAX_NOTES : revealedCount();
    playSequence(currentSong.notes.slice(0, count));
  });

  btnAdd.addEventListener("click", () => {
    if(isOver()) return;
    const rev = revealedCount();
    if(rev < MAX_NOTES){
      state.revealed = rev + 1;
      persist();
      render();
    }
  });

  btnName.addEventListener("click", openGuess);
  btnCancelGuess.addEventListener("click", closeGuess);

  btnSubmitGuess.addEventListener("click", () => {
    if(isOver()) return;
    const guess = normTitle(guessInput.value);
    const answer = normTitle(currentSong.title);
    if(!guess) return;

    if(guess === answer){
      state.status = "solved";
      state.solvedIn = revealedCount();
      state.gaveUpAt = null;
      persist();
      closeGuess();
      render();
      showOverlay("solved");
    } else {
      guessInput.select();
      guessInput.style.outline = "3px solid #111";
      setTimeout(() => guessInput.style.outline = "", 180);
    }
  });

  guessInput.addEventListener("keydown", (e) => {
    if(e.key === "Enter"){ e.preventDefault(); btnSubmitGuess.click(); }
    if(e.key === "Escape"){ e.preventDefault(); closeGuess(); }
  });

  btnGiveUp.addEventListener("click", () => {
    if(isOver()) return;
    state.status = "gaveup";
    state.gaveUpAt = revealedCount();
    state.solvedIn = null;
    persist();
    closeGuess();
    render();
    showOverlay("gaveup");
  });

  modalClose.addEventListener("click", hideOverlay);
  overlay.addEventListener("click", (e) => { if(e.target === overlay) hideOverlay(); });
  btnCopy.addEventListener("click", copyShare);

  document.addEventListener("keydown", (e) => {
    if(e.key === "Escape"){
      if(overlay.classList.contains("show")) hideOverlay();
      if(drawer.classList.contains("show")) closeDrawer();
      closeGuess();
    }
  });

  // iOS: ensure audio starts on gesture
  document.addEventListener("pointerdown", () => {
    try{
      ensureAudio();
      if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    } catch {}
  }, { once: true });

  /**************************************************************************
   *  INIT
   **************************************************************************/
  render();
})();
</script>
</body>
</html>
