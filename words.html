<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>/text — Live Text Channel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Supabase JS v2 (CDN) -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }

    body {
      font-family: Anton, Impact, "Arial Narrow", "Helvetica Neue Condensed", "Helvetica Neue", Arial, sans-serif;
      background: #000;
      color: #fff;
      overflow: hidden;
    }

    #display {
      width: 100%;
      height: 100%;
      padding: 5vw;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: clamp(40px, 8vw, 180px);
      line-height: 1.05;
      letter-spacing: 0.01em;
      word-break: break-word;
      white-space: pre-wrap;
      user-select: none;
    }

    #takeControl {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 50;
      padding: 12px 14px;
      font-size: 16px;
      border: 0;
      border-radius: 12px;
      background: rgba(255,255,255,0.12);
      color: #fff;
      backdrop-filter: blur(6px);
      cursor: pointer;
    }
    #takeControl:active { transform: scale(0.99); }

    #controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 60;
      display: none;
      gap: 10px;
      padding: 12px;
      background: rgba(0,0,0,0.78);
      border-top: 1px solid rgba(255,255,255,0.10);
      backdrop-filter: blur(8px);
    }

    #controlsInner {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 1200px;
      margin: 0 auto;
    }

    textarea {
      width: 100%;
      height: 96px;
      resize: none;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color: #fff;
      font-family: inherit;
      font-size: 18px;
      outline: none;
    }

    .row { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      cursor: pointer;
      background: rgba(255,255,255,0.12);
      color: #fff;
    }
    .btn:active { transform: scale(0.99); }

    .hint {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-size: 12px;
      opacity: 0.75;
      margin-top: -4px;
    }
  </style>
</head>
<body>

  <div id="display"></div>

  <button id="takeControl" type="button">Take control</button>

  <div id="controls">
    <div id="controlsInner">
      <textarea id="textInput" placeholder="Type text…"></textarea>
      <div class="hint">Changes broadcast instantly. Latest update wins.</div>

      <div class="row" aria-label="Background mode">
        <button class="btn" type="button" data-bg="black">Black BG (blend)</button>
        <button class="btn" type="button" data-bg="invert">Invert</button>
      </div>

      <div class="row" aria-label="Text colour palette">
        <button class="btn" type="button" data-color="white">White</button>
        <button class="btn" type="button" data-color="offwhite">Off-white</button>
        <button class="btn" type="button" data-color="yellow">Yellow</button>
        <button class="btn" type="button" data-color="red">Dark red</button>
        <button class="btn" type="button" data-color="blue">Dark blue</button>
        <button class="btn" type="button" data-color="charcoal">Charcoal</button>
      </div>
    </div>
  </div>

<script>
/* =========================
   Supabase config (yours)
   ========================= */
const SUPABASE_URL = "https://fnqzcwscmyglptvihekl.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_jKWmYLsR_5q4oHVh36MvVg_vBGB5Pfn";
const TABLE = "text_channel";
const ROW_ID = "f5d13f98-11d9-49c4-ab0a-176bf5bc33d3";

/* =========================
   Init
   ========================= */
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

/* =========================
   UI refs
   ========================= */
const display = document.getElementById("display");
const controls = document.getElementById("controls");
const takeControlBtn = document.getElementById("takeControl");
const textInput = document.getElementById("textInput");

let isController = false;
let debounceTimer = null;

/* =========================
   Palette
   ========================= */
const COLORS = {
  white: "#ffffff",
  offwhite: "#f2f2ed",
  yellow: "#f2c94c",
  red: "#5b0f14",
  blue: "#0b1c2d",
  charcoal: "#1a1a1a"
};

/* =========================
   Render state
   ========================= */
function applyState(row) {
  const txt = (row && typeof row.current_text === "string") ? row.current_text : "";
  display.textContent = txt;

  const bgMode = row?.bg_mode || "black";
  const textColorKey = row?.text_color || "white";

  if (bgMode === "invert") {
    document.body.style.background = "#ffffff";
    display.style.color = "#000000";
  } else {
    document.body.style.background = "#000000";
    display.style.color = COLORS[textColorKey] || "#ffffff";
  }

  // ✅ CRITICAL FIX:
  // Never overwrite the controller textarea while the user is actively typing (focused),
  // otherwise realtime echoes will fight the keystrokes and "delete" letters.
  if (isController && document.activeElement !== textInput) {
    if (textInput.value !== txt) textInput.value = txt;
  }
}

/* =========================
   Load initial row
   ========================= */
async function loadInitial() {
  const { data, error } = await sb
    .from(TABLE)
    .select("*")
    .eq("id", ROW_ID)
    .maybeSingle();

  if (error) {
    display.textContent = "Supabase error loading row";
    console.error(error);
    return;
  }
  if (!data) {
    display.textContent = "No row found (check ROW_ID)";
    return;
  }
  applyState(data);
}
loadInitial();

/* =========================
   Realtime subscribe
   ========================= */
sb
  .channel("text_channel_updates")
  .on(
    "postgres_changes",
    { event: "UPDATE", schema: "public", table: TABLE },
    (payload) => {
      const row = payload?.new;
      if (row && row.id === ROW_ID) applyState(row);
    }
  )
  .subscribe();

/* =========================
   Controller enable
   ========================= */
takeControlBtn.addEventListener("click", async () => {
  isController = true;
  controls.style.display = "flex";
  takeControlBtn.style.display = "none";

  // Pull latest text into textarea ONCE when taking control
  const { data } = await sb
    .from(TABLE)
    .select("current_text,bg_mode,text_color")
    .eq("id", ROW_ID)
    .maybeSingle();

  if (data) {
    applyState({ id: ROW_ID, ...data });
    textInput.value = data.current_text || "";
  }

  textInput.focus();
});

/* =========================
   Debounced text updates
   ========================= */
textInput.addEventListener("input", (e) => {
  if (!isController) return;
  const value = e.target.value;

  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    sb
      .from(TABLE)
      .update({ current_text: value, updated_at: new Date().toISOString() })
      .eq("id", ROW_ID)
      .then(({ error }) => { if (error) console.error(error); });
  }, 120);
});

/* =========================
   Background mode buttons
   ========================= */
document.querySelectorAll("[data-bg]").forEach((btn) => {
  btn.addEventListener("click", () => {
    const bg_mode = btn.dataset.bg;
    sb
      .from(TABLE)
      .update({ bg_mode, updated_at: new Date().toISOString() })
      .eq("id", ROW_ID)
      .then(({ error }) => { if (error) console.error(error); });
  });
});

/* =========================
   Text colour palette buttons
   ========================= */
document.querySelectorAll("[data-color]").forEach((btn) => {
  btn.addEventListener("click", () => {
    const text_color = btn.dataset.color;
    sb
      .from(TABLE)
      .update({ text_color, updated_at: new Date().toISOString() })
      .eq("id", ROW_ID)
      .then(({ error }) => { if (error) console.error(error); });
  });
});
</script>
</body>
</html>
